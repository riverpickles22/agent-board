<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-board</title>
<script>
  /* Before any paint: a saved theme wins over the OS. Inline and first so the
     page never flashes the other scheme on the way in. Unset = follow the OS,
     which is what the prefers-color-scheme blocks below already do. */
  try{ var t = localStorage.getItem("agent-board:theme");
       if(t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t); }catch(e){}
</script>
<style>
  :root{
    --ground:#EEF2F3; --panel:#FFFFFF; --card:#FFFFFF; --card-2:#F3F7F8;
    --ink:#152229; --ink-2:#3F5158; --ink-3:#5F7076; --line:#D3DCDE; --line-2:#E5ECED;
    --accent:#0E7E8B; --accent-soft:rgba(14,126,139,.10);
    --mono:ui-monospace,"SF Mono","JetBrains Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    /* per-lane identity colours, cycled if there are more lanes than colours */
    --lane-0:#5C7488; --lane-1:#6B4FC4; --lane-2:#A56E12; --lane-3:#0E7E8B; --lane-4:#C8481F; --lane-5:#2F7E5A;
    --shadow:0 1px 2px rgba(16,36,43,.05), 0 10px 26px rgba(16,36,43,.09);
  }
  /* Dark theme: VS Code Dark Modern-inspired — neutral grays (no color cast),
     near-white text, VS Code's own accent hues. */
  @media (prefers-color-scheme:dark){
    :root{
      --ground:#1F1F1F; --panel:#252526; --card:#2A2A2B; --card-2:#313132;
      --ink:#E8E8E8; --ink-2:#BDBDBD; --ink-3:#9A9A9A; --line:#3F3F41; --line-2:#333335;
      --accent:#4DAAFC; --accent-soft:rgba(77,170,252,.14);
      --lane-0:#9DA9B5; --lane-1:#C586C0; --lane-2:#E2C08D; --lane-3:#4FC1FF; --lane-4:#F48771; --lane-5:#89D185;
      --shadow:0 1px 2px rgba(0,0,0,.32), 0 12px 32px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="light"]{
    --ground:#EEF2F3; --panel:#FFFFFF; --card:#FFFFFF; --card-2:#F3F7F8;
    --ink:#152229; --ink-2:#3F5158; --ink-3:#5F7076; --line:#D3DCDE; --line-2:#E5ECED;
    --accent:#0E7E8B; --accent-soft:rgba(14,126,139,.10);
    --lane-0:#5C7488; --lane-1:#6B4FC4; --lane-2:#A56E12; --lane-3:#0E7E8B; --lane-4:#C8481F; --lane-5:#2F7E5A;
    --shadow:0 1px 2px rgba(16,36,43,.05), 0 10px 26px rgba(16,36,43,.09);
  }
  :root[data-theme="dark"]{
    --ground:#1F1F1F; --panel:#252526; --card:#2A2A2B; --card-2:#313132;
    --ink:#E8E8E8; --ink-2:#BDBDBD; --ink-3:#9A9A9A; --line:#3F3F41; --line-2:#333335;
    --accent:#4DAAFC; --accent-soft:rgba(77,170,252,.14);
    --lane-0:#9DA9B5; --lane-1:#C586C0; --lane-2:#E2C08D; --lane-3:#4FC1FF; --lane-4:#F48771; --lane-5:#89D185;
    --shadow:0 1px 2px rgba(0,0,0,.32), 0 12px 32px rgba(0,0,0,.34);
  }
  /* Semantic state tokens — one meaning per hue (design/system.md → the
     state colour legend). Aliases of the palette above, so they follow
     the theme automatically and add no new colours. Colour communicates
     state and nothing else: the left border carries workflow state, and
     any orthogonal fact (blocked, conviction) is a pill, never a
     border recolour. Red is reserved for actual problems. */
  :root{
    /* ideas — a maturity scale: dormant → shaping → decide → cleared */
    --st-idle:var(--ink-3);      /* back burner — preserved, not now     */
    --st-active:var(--accent);   /* front burner — actively being shaped */
    --st-decide:var(--lane-2);   /* ready for review — awaiting a call   */
    --st-ready:var(--lane-5);    /* ready to implement — cleared         */
    /* board — execution state (amber reads the same: waiting on someone) */
    --st-blocked:var(--lane-2);  /* gate closed / unmet dependency       */
    --st-problem:var(--lane-4);  /* rejected, refused, over-limit        */
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;height:100vh;overflow:hidden}

  header{padding:16px 22px 12px;border-bottom:1px solid var(--line-2);flex:0 0 auto}
  .hrow{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  h1{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0}
  .sub{font-size:13px;color:var(--ink-2);margin-left:auto;display:flex;align-items:center;gap:16px}
  #counts{font-variant-numeric:tabular-nums}
  .save{font-size:12.5px;display:flex;align-items:center;gap:7px;color:var(--ink-2)}
  .save .d{width:8px;height:8px;border-radius:50%;background:var(--lane-5);transition:background .2s}
  .save.saving .d{background:var(--lane-2);animation:pulse 1s infinite}
  .save.err .d{background:var(--lane-4)}

  .filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:13px;padding:0 22px}
  .flabel{font-size:12px;color:var(--ink-3);margin-right:3px}
  .fsel{display:inline-flex;align-items:center;gap:5px}
  .fsel select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--card);
    border:1px solid var(--line);border-radius:20px;padding:4px 8px;cursor:pointer;max-width:19ch}
  .fsel select:hover{border-color:var(--accent)}
  .fmore .fdot{color:var(--accent)}
  .frow2{flex-basis:100%;display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px}
  .chip{font-family:var(--sans);font-size:14px;font-weight:500;padding:6px 13px;border-radius:20px;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-2);cursor:pointer;transition:all .12s ease}
  .chip:hover{border-color:var(--accent);color:var(--ink)}
  .chip.savev{border-style:dashed;color:var(--accent);margin-left:10px}
  .chip.savev:hover{background:var(--accent-soft)}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .chip[aria-pressed="true"]{color:#1F1F1F}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#1F1F1F}}

  /* ---- next up (the selection rule, rendered) ---- */
  .nextup{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px;padding:0 22px}
  .nextup .pick{display:inline-flex;align-items:baseline;gap:8px;font-size:13.5px;padding:6px 12px;border-radius:9px;
    border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));background:var(--accent-soft);cursor:pointer;transition:all .12s ease}
  .nextup .pick:hover{border-color:var(--accent)}
  .nextup .pick .pid{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent)}
  .nextup .pick .pnm{color:var(--ink);font-weight:500;max-width:26ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nextup .pick .pwhy{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
  .nextup .none{font-size:13px;color:var(--ink-3)}
  /* the agent work queue reads as a block, not an aside */
  .readyq{margin:8px 22px 0;padding:10px 14px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);display:block}
  .readyq.empty{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0 22px}
  .rq-h{font-size:12px;font-weight:700;color:var(--ink-2);display:flex;align-items:baseline;gap:8px}
  .rq-n{font-family:var(--mono);color:var(--st-ready);font-size:13px}
  .rq-sub{font-weight:400;font-size:11px;color:var(--ink-3);margin-left:auto}
  .rq-flight{font-weight:400;font-size:11px;color:var(--accent);margin-left:2px}
  .rq-item.flight{background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .rq-item.stale .rq-who{color:var(--st-blocked)}
  .rq-rel{border:0;background:none;color:var(--ink-3);cursor:pointer;font-size:13px;padding:0 4px;flex:0 0 auto}
  .rq-rel:hover{color:var(--st-blocked)}
  .rq-item.flight{cursor:pointer}
  .rq-item .rq-who{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--accent);white-space:nowrap}
  .rq-list{display:flex;flex-direction:column;gap:2px;margin-top:6px}
  .rq-item{display:flex;align-items:baseline;gap:10px;padding:5px 8px;border:0;border-radius:7px;
    background:none;cursor:pointer;text-align:left;width:100%}
  .rq-item:hover{background:var(--accent-soft)}
  .rq-item .rid{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);flex:0 0 auto}
  .rq-item .rnm{font-size:13.5px;color:var(--ink)}
  .rq-item .rq-why{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);white-space:nowrap}
  .readyq-old{margin-top:6px}
  .readyq .repic{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-3);margin-right:-1px}
  .readyq .rpick{display:inline-flex;align-items:baseline;gap:7px;font-size:13px;padding:5px 11px;border-radius:9px;
    border:1px solid var(--line);background:var(--card);cursor:pointer}
  .readyq .rpick:hover{border-color:var(--accent)}
  .readyq .rpick .rk{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3)}
  .readyq .rpick .rid{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent)}
  .readyq .rpick .rnm{color:var(--ink);font-weight:500;max-width:24ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .exec{flex:1 1 auto;display:flex;gap:12px;padding:16px 22px 20px;overflow-x:auto;overflow-y:hidden;align-items:stretch}
  .col{flex:1 1 0;min-width:170px;display:flex;flex-direction:column;background:var(--panel);
    border:1px solid var(--line);border-top:2px solid var(--lc);border-radius:12px;min-height:0}
  .col-h{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line-2);flex:0 0 auto;
    background:color-mix(in srgb, var(--lc) 10%, var(--panel));border-radius:11px 11px 0 0}
  .col-h .sw{width:10px;height:10px;border-radius:3px;background:var(--lc);flex:0 0 auto}
  .col-h .nm{font-size:14px;font-weight:600;color:var(--lc);letter-spacing:-.01em}
  .col-h .ct{margin-left:auto;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:500}
  .col-h .ct.wlim.over, .rows-head .ct.wlim.over{color:var(--st-problem);font-weight:700}
  .col-body{flex:1 1 auto;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
  .col.drop-hover{border-color:var(--accent)}
  .col.drop-hover .col-body{background:var(--accent-soft)}
  body.is-dragging .col.no-drop{opacity:.4}
  .addcard{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink-3);background:transparent;
    border:1px dashed var(--line);border-radius:8px;padding:9px;width:100%;cursor:pointer;transition:all .12s ease;flex:0 0 auto}
  .addcard:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:grab;
    transition:transform .1s ease,border-color .1s ease,box-shadow .1s ease}
  /* Same rule on the execution side, where the section's colour is the
     lane's — `--lc` already rides the column and the swimlane cell
     (laneVar(): first gray, review amber, done green, active accent). */
  .card:hover{border-color:var(--lc,var(--accent));box-shadow:var(--shadow);
    background:color-mix(in srgb,var(--lc,var(--accent)) 9%,var(--card))}
  /* The unblocked edge says "startable now" — a different fact from the
     lane, so the lane's hover colour must not eat it. */
  .card.unblocked:hover{border-left-color:var(--st-ready)}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.4;box-shadow:none}
  body.is-dragging .card:not(.dragging){pointer-events:none}
  .card .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .card .id{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent)}
  .card .title{font-size:15px;line-height:1.4;margin:7px 0 0;font-weight:550;color:var(--ink);letter-spacing:-.005em}
  .meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:10px}
  .tagpill{font-size:12px;font-weight:500;padding:2px 8px;border-radius:20px;letter-spacing:.01em;background:var(--card-2);color:var(--ink-2);border:1px solid var(--line)}
  .tagpill.sys{font-family:var(--mono);font-size:11px;color:var(--ink-3);border-style:dashed}
  .st{font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--ink-2)}
  .prio{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;flex:0 0 auto}
  .prio.p0{background:var(--accent);color:#fff} :root[data-theme="dark"] .prio.p0{color:#1F1F1F}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .prio.p0{color:#1F1F1F}}
  .prio.p1{border:1px solid var(--ink-3);color:var(--ink-2)}
  .prio.p2{color:var(--ink-3)} .prio.p3{color:var(--ink-3);opacity:.75}
  .card .dep{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
  .card .dep.warn{color:var(--lane-4);font-weight:600}
  /* one chip per dependency, coloured by that dep's own state */
  .depid{margin-left:4px}
  .depid.met{color:var(--st-ready);font-weight:600}
  /* unmet is *blocked*, not broken — amber, per the state legend */
  .depid.unmet{color:var(--st-blocked);font-weight:600}
  .depid.unknown{color:var(--st-idle);text-decoration:underline dotted}
  /* the last dep landed and nothing else blocks a start — border only,
     no card-wide tint (the legend keeps colour to edges and pills) */
  .card.unblocked{border-left:3px solid var(--st-ready)}
  .rdytag{font-size:11px;font-weight:700;color:var(--st-ready)}
  .swim.unblocked{border-left:3px solid var(--st-ready)}
  .claim{font-size:11.5px;color:var(--accent);font-weight:600}
  .claim.stale{color:var(--st-blocked)}   /* suspect, not wrong — a human decides */
  .stbadge{font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .stbadge .rdy{color:var(--lane-5);font-weight:600}

  /* ---- rows mode (story swimlanes by epic) ---- */
  /* No top padding on the scroll container: sticky children can't cover a
     parent's padding band, so scrolled rows would show through it. The
     head carries the spacing instead and its background masks the seam. */
  .exec.rows{display:block;overflow-y:auto;overflow-x:hidden;padding-top:0}
  .rows-head{position:sticky;top:0;z-index:2;display:grid;grid-template-columns:repeat(var(--lanes),1fr);
    background:var(--ground);padding-top:16px;padding-bottom:10px;border:1px solid transparent;border-bottom:0}
  .rows-head .rh{display:flex;align-items:center;gap:8px;padding:8px 12px;
    background:color-mix(in srgb, var(--lc) 10%, var(--panel));border:1px solid var(--line);border-left:0;border-top:2px solid var(--lc)}
  .rows-head .rh:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px}
  .rows-head .rh:last-child{border-radius:0 9px 9px 0}
  .rows-head .rh .sw{width:10px;height:10px;border-radius:3px;background:var(--lc);flex:0 0 auto}
  .rows-head .rh .nm{font-size:13.5px;font-weight:600;color:var(--lc)}
  .rows-head .rh .ct{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .swim{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:12px}
  .swim-h{display:flex;align-items:baseline;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line-2);cursor:pointer}
  .swim-h:hover .en{color:var(--accent)}
  .swim-h .eid{font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--accent)}
  .swim-h .en{font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:-.005em;transition:color .12s ease}
  .swim-h .egate{font-size:11px;color:var(--lane-2);font-weight:600}
  .swim-h .edone{margin-left:auto;font-size:12px;color:var(--st-ready);font-weight:600}
  .swim.done-fold{opacity:.72}
  .swim.done-fold .swim-h{border-bottom:0}
  .rowarch{margin-left:10px;font-size:11px;padding:2px 9px}
  .eroll{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-3);
    font-variant-numeric:tabular-nums;white-space:nowrap}
  .eroll .bar{display:inline-block;width:56px;height:4px;border-radius:3px;background:var(--line);overflow:hidden}
  .eroll .bar i{display:block;height:100%;background:var(--st-ready)}
  .eroll .rdy{color:var(--st-ready);font-weight:700}
  .eroll .needs{color:var(--st-blocked);font-weight:700}
  /* the one state that is asking for a person — amber edge, reason on the card */
  .scard.needs-you, .card.needs-you{border-left:3px solid var(--st-blocked)}
  .needsline{font-size:11.5px;color:var(--st-blocked);margin-top:5px;line-height:1.4}
  .donefold{font-size:12px;color:var(--st-ready);background:none;border:1px dashed var(--line);
    border-radius:8px;padding:7px 10px;cursor:pointer;width:100%;text-align:left}
  .donefold:hover{border-color:var(--st-ready)}
  .card .egate{font-size:11px;color:var(--lane-2);font-weight:600}
  .swim-h .eprog{margin-left:auto;font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .swim-b{display:grid;grid-template-columns:repeat(var(--lanes),1fr)}
  .swim .cell{min-height:56px;padding:9px;display:flex;flex-direction:column;gap:8px;
    border-top:2px solid var(--lc);border-right:1px solid var(--line-2)}
  .swim .cell:last-child{border-right:0}
  .swim .cell.drop-hover{background:var(--accent-soft)}
  body.is-dragging .swim .cell.no-drop{opacity:.4}
  .scard{background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:grab;
    transition:border-color .1s ease,box-shadow .1s ease}
  .scard:hover{border-color:var(--lc,var(--accent));box-shadow:var(--shadow);
    background:color-mix(in srgb,var(--lc,var(--accent)) 10%,var(--card-2))}
  .scard:active{cursor:grabbing}
  .scard.dragging{opacity:.4;box-shadow:none}
  body.is-dragging .scard:not(.dragging){pointer-events:none}
  .scard .srow{display:flex;align-items:center;gap:7px}
  .scard .sk{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px;flex:0 0 auto}
  .scard .sid{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--accent)}
  .sstate{margin-left:auto;font-size:10.5px;font-weight:600;flex:0 0 auto;white-space:nowrap}
  .sstate.ok{color:var(--lane-5)}
  .sstate.warn{color:var(--lane-2)}
  .sstate.rev{color:var(--st-decide)}
  .sstate.act{color:var(--accent)}
  .sstate.dim{color:var(--ink-3);font-weight:500}
  .scard .snm{font-size:13px;line-height:1.35;color:var(--ink);margin-top:4px}
  .rows-note{font-size:12.5px;color:var(--ink-3);padding:2px 2px 14px}

  /* ---- stories (inside the epic modal) ---- */
  .story-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);
    border-radius:8px;margin-top:7px;background:var(--card-2)}
  .story-row .sk{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);
    border-radius:4px;padding:1px 5px;flex:0 0 auto}
  .story-row .sn{font-size:14px;color:var(--ink);flex:1 1 auto;cursor:pointer;line-height:1.35}
  .story-row .sn:hover{color:var(--accent)}
  .story-row .slane{font-family:var(--mono);font-size:10px;color:var(--ink-3);flex:0 0 auto}
  .story-row label.rdy-t{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--ink-3);flex:0 0 auto;cursor:pointer}
  .story-row .sstate{margin-left:0;font-size:10px}   /* .sn already flexes; keep the chip snug beside the lane */
  .story-row input[type=checkbox]{accent-color:var(--accent);cursor:pointer}
  .addstory{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink-3);background:transparent;
    border:1px dashed var(--line);border-radius:8px;padding:7px;width:100%;cursor:pointer;margin-top:8px;transition:all .12s ease}
  .addstory:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

  /* ---- tabs + views ---- */
  .tabs{display:flex;gap:4px;margin-left:6px}
  .tab{font-family:var(--sans);font-size:14px;font-weight:600;padding:7px 14px;border-radius:8px;border:1px solid transparent;
    background:transparent;color:var(--ink-3);cursor:pointer;transition:all .12s ease}
  .tab:hover{color:var(--ink);background:var(--card-2)}
  .tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
  .tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .view{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  /* !important: .view.scroll{display:block} ties this selector's specificity
     and comes later in the sheet — without it, hidden scroll views stay visible. */
  .view[hidden]{display:none!important}
  .view.scroll{display:block;overflow-y:auto;padding:24px 26px 48px}
  .vhead{max-width:760px;margin:0 0 20px}
  .vhead h2{font-size:21px;margin:0 0 5px;letter-spacing:-.015em}
  .vhead p{color:var(--ink-2);font-size:15px;margin:0;line-height:1.55}

  /* ---- milestones ---- */
  .ov-block{margin:0 0 26px;padding:18px 22px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
  .ov-grid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:28px;align-items:start}
  .ms-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;align-items:start;margin-top:4px}
  .ms-grid>div>.ms-section:first-child{margin-top:12px}
  @media (max-width:1100px){.ov-grid,.ms-grid{grid-template-columns:1fr}}
  .ov-block h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:0 0 8px;font-weight:600}
  .ov-block p{margin:0;font-size:15.5px;line-height:1.65;color:var(--ink);max-width:78ch}
  .ctxdocs{margin-top:12px;display:flex;flex-direction:column;gap:6px}
  .ctxdoc{display:flex;align-items:baseline;gap:9px;font-size:13.5px;flex-wrap:wrap}
  .ctxdoc .cl{font-weight:600;color:var(--ink);flex:0 0 auto}
  .ctxdoc .cp{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
  .ctxdoc .cn{color:var(--ink-3)}
  #m-ctxdocs .ctxdoc{cursor:copy;border-radius:6px;padding:2px 4px;margin:-2px -4px}
  #m-ctxdocs .ctxdoc:hover{background:var(--accent-soft)}
  .ms-nav{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
  .ms-tab{font-family:var(--sans);font-size:14px;font-weight:600;padding:9px 15px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink-2);cursor:pointer}
  .ms-tab .mt-id{font-family:var(--mono);color:var(--accent);margin-right:8px}
  .ms-tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
  .ms-body{max-width:none}
  .ms-body>h2{font-size:24px;margin:0 0 4px;letter-spacing:-.02em}
  .ms-tagline{font-size:16px;color:var(--accent);margin:0 0 4px;font-weight:500}
  .ms-section{margin-top:22px}
  .ms-section>h3{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);margin:0 0 8px;font-weight:600}
  .ms-section>p{margin:0;color:var(--ink);font-size:15.5px;line-height:1.65;max-width:78ch}
  .ms-meta{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px} /* gate/exit and ROI stack full-width, gate first */
  .ms-meta .box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--panel)}
  .ms-meta .box .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:5px;font-weight:600}
  .ms-meta .box .v{font-size:14px;color:var(--ink-2);line-height:1.5}
  .deliv{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:9px;background:var(--panel)}
  .deliv .dn{font-size:15px;font-weight:600;color:var(--ink)}
  .deliv .dd{font-size:14px;color:var(--ink-2);margin:4px 0 7px;line-height:1.45}
  .mbar{display:block;height:7px;border-radius:4px;background:var(--line);overflow:hidden;display:flex}
  .mbar.mini{height:4px;width:120px;display:inline-flex;margin-left:9px;vertical-align:middle}
  .mbar i{display:block;height:100%}
  .mbar i.d{background:var(--st-ready)}
  .mbar i.f{background:var(--accent)}
  .mbar i.q{background:var(--st-idle)}
  .mbar-lab{font-size:12.5px;color:var(--ink-3);margin-top:7px;font-variant-numeric:tabular-nums}
  .chip-epic{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--accent);
    border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-radius:5px;padding:1px 7px;margin:3px 4px 0 0;cursor:pointer;background:var(--accent-soft)}
  .chip-epic:hover{background:var(--accent);color:#fff}
  :root[data-theme="dark"] .chip-epic:hover{color:#1F1F1F}
  .chip-epic.done{color:var(--lane-5);border-color:color-mix(in srgb,var(--lane-5) 40%,transparent);background:color-mix(in srgb,var(--lane-5) 10%,transparent)}
  .chip-epic.missing{opacity:.45;cursor:default}
  .arch-sub{display:flex;align-items:baseline;gap:10px;padding:8px 0;border-bottom:1px solid var(--line-2)}
  .arch-sub .state{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:5px;flex:0 0 auto}
  .arch-sub .state.new{color:var(--lane-5);border:1px solid color-mix(in srgb,var(--lane-5) 48%,transparent)}
  .arch-sub .state.changed{color:var(--lane-2);border:1px solid color-mix(in srgb,var(--lane-2) 48%,transparent)}
  .arch-sub .state.existing{color:var(--ink-3);border:1px solid var(--line)}
  .arch-sub .an{font-size:14.5px;font-weight:600;color:var(--ink)}
  .arch-sub .anote{font-size:13.5px;color:var(--ink-3)}

  /* ---- ideas ---- */
  .ideas-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-height:60vh} /* columns stretch (and the row keeps real height) so even empty ones are full drop targets */
  /* ---- lens switcher ---- */
  .lensrow{display:flex;align-items:center;gap:6px;margin-left:14px;padding-left:14px;border-left:1px solid var(--line)}
  .lenslab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600}
  /* ---- leverage lens: tiers stack, they do not sit side by side ----
     A tier is a horizontal band because the reading is top-to-bottom: what
     must exist first, then what it makes possible. Columns would imply the
     groups are alternatives; they are a sequence. */
  .ideas-tiers{display:flex;flex-direction:column;gap:0}
  .tier{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px 4px}
  .tier>h3.tierh{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
    margin:0 0 12px;font-weight:600;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .tier .cnt{font-family:var(--mono);color:var(--ink-3)}
  .tier .tierhint{margin-left:auto;font-size:11.5px;text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:400}
  .tier-body{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px;align-items:start}
  .tier-body .idea{margin-bottom:0}
  .tierlink{align-self:center;color:var(--ink-3);font-size:18px;line-height:1;padding:7px 0}
  /* The first tier is the answer this view exists to give. */
  .ideas-tiers .tier:first-child{border-color:color-mix(in srgb,var(--accent) 42%,var(--line))}
  .ideas-tiers .tier:first-child>h3.tierh{color:var(--accent)}
  /* Standalone is a footnote, not a tier — it gets no connector and no weight. */
  .tier.standalone{background:transparent;border-style:dashed;margin-top:18px}
  .tier.cyc{border-color:color-mix(in srgb,var(--lane-2) 55%,var(--line))}
  .tier.cyc>h3.tierh{color:var(--lane-2)}
  .cycwarn{font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--lane-2);margin:0 0 12px}
  @media (max-width:820px){.tier-body{grid-template-columns:1fr}}
  .ideas-col>h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 10px;font-weight:600;display:flex;gap:8px;align-items:center}
  .ideas-col .cnt{font-family:var(--mono);color:var(--ink-3)}
  .idea{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--panel);margin-bottom:10px;cursor:pointer;transition:all .12s}
  /* At rest the state lives on the left edge alone — one quiet stripe per
     card, so a column scans as a column. On hover the card commits to that
     colour whole: same hue on every edge, over a wash faint enough to keep
     the prose readable. Hover is the only moment one card should outrank
     its neighbours, so it is the only moment the colour spreads. */
  .idea:hover{border-color:var(--cc,var(--accent));box-shadow:var(--shadow);
    background:color-mix(in srgb,var(--cc,var(--accent)) 9%,var(--panel))}
  .idea .it{font-size:15px;font-weight:600;color:var(--ink)}
  .idea .ia{font-size:13.5px;color:var(--ink-2);margin-top:5px;line-height:1.45;white-space:pre-line}
  .idea .irel{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:9px}
  .idea .idep{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:8px}
  /* one-sentence outcome, clamped: the essay lives on the deep dive */
  .idea .iout{font-size:13.5px;color:var(--ink-2);margin-top:5px;line-height:1.45;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  /* status pill (workflow) + conviction (orthogonal, deliberately quieter) */
  .spill{font-size:10.5px;font-weight:700;letter-spacing:.02em;border-radius:20px;padding:2px 9px;
    border:1px solid currentColor;background:color-mix(in srgb, currentColor 10%, transparent)}
  .spill.idle{color:var(--st-idle)} .spill.front{color:var(--st-active)}
  .spill.review{color:var(--st-decide)} .spill.ready{color:var(--st-ready)}
  .spill.done{color:var(--st-ready)} .spill.rejected{color:var(--st-problem)}
  .conv{font-size:10.5px;color:var(--ink-3);font-style:italic}
  /* structured facts — label dim, value readable, one line each */
  .ifact{font-size:11.5px;color:var(--ink-2);margin-top:6px;line-height:1.4}
  .ifact b{color:var(--ink-3);font-weight:600}
  .ifact.decide{color:var(--ink);border-top:1px solid var(--line-2);margin-top:9px;padding-top:7px}
  /* leverage is a fact, not a state — neutral, so the stage keeps the stage's colour */
  .lev{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-weight:700}
  /* on ideas, dependency marks stay neutral for the same reason */
  .idea .depid.met, .idea .depid.unmet, .idea .depid.unknown{color:var(--ink-3);font-weight:500}
  .idea .depid.met{color:var(--ink-2)}
  .ideas-col h4.burner{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);
    margin:2px 0 8px;font-weight:700;display:flex;gap:7px;align-items:center}
  .ideas-col h4.burner.back{color:var(--ink-3)}
  .ideas-col h4.burner .cnt{font-family:var(--mono);font-weight:500}
  /* The left border carries workflow state and nothing else. One class
     per state, set by the renderer — no cascade races between burner,
     column and blocked-ness the way the old accent/green edges had. */
  .idea[data-state]{--cc:var(--st-idle);border-left:3px solid var(--cc)}
  .idea[data-state="front"]{--cc:var(--st-active)}
  .idea[data-state="review"]{--cc:var(--st-decide)}
  .idea[data-state="ready"]{--cc:var(--st-ready)}
  .idea[data-state="done"]{--cc:var(--st-ready)}
  .idea[data-state="rejected"]{--cc:var(--st-problem)}
  .bsec.back{background:color-mix(in srgb, var(--ground) 65%, var(--panel));border:1px dashed var(--line);
    border-radius:12px;padding:12px 12px 3px;margin-top:18px}
  .bsec.back.folded{padding-bottom:12px}
  .bsec.back.folded .idea{display:none}
  h4.burner[role=button]{cursor:pointer;user-select:none}
  h4.burner .fold{font-size:9px;margin-right:1px}
  .bsec.back .idea .it{color:var(--ink-2)}
  .idea[draggable=true]{cursor:grab}
  .idea[draggable=true]:active{cursor:grabbing}
  .idea.dragging{opacity:.4}
  body.is-dragging .idea:not(.dragging){pointer-events:none}
  .ideas-col{border-radius:10px}
  .ideas-col.drop-hover, .bsec.drop-hover{background:var(--accent-soft);outline:1px solid color-mix(in srgb,var(--accent) 30%,transparent);outline-offset:4px}
  /* insertion line: a 2px accent sliver in the gap the drop would land in */
  .idea.drop-before{box-shadow:0 -7px 0 -5px var(--accent)}
  .idea.drop-after{box-shadow:0 7px 0 -5px var(--accent)}
  .idea .imeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px;align-items:center}
  .qwin{font-size:11.5px;font-weight:700;color:var(--lane-5);border:1px solid color-mix(in srgb,var(--lane-5) 45%,transparent);
    background:color-mix(in srgb,var(--lane-5) 10%,transparent);border-radius:20px;padding:2px 9px}
  .ei{font-size:11.5px;font-weight:500;color:var(--ink-2);border:1px solid var(--line);border-radius:20px;padding:2px 9px;background:var(--card-2)}

  /* ---- idea detail (deep dive) ---- */
  .idd{max-width:1760px}   /* bounded so ultrawide doesn't produce one enormous line */
  .idd .back{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--accent);background:transparent;border:none;cursor:pointer;padding:0;margin-bottom:14px}
  .idd .back:hover{text-decoration:underline}
  .idd h2{font-size:24px;margin:0 0 6px;letter-spacing:-.02em}
  .idd .ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  /* lifecycle stepper: the three-status pipeline as orientation */
  .steps{display:flex;align-items:center;flex-wrap:wrap;margin:0 0 10px}
  .steps .step{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
  .steps .step .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto}
  .steps .step.done{color:var(--ink-2)}
  .steps .step.done .dot{background:var(--accent);border-color:var(--accent)}
  .steps .step.on{color:var(--accent)}
  .steps .step.on .dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .steps .bar{width:26px;height:2px;background:var(--line);margin:0 9px;flex:0 0 auto}
  .steps .bar.done{background:color-mix(in srgb,var(--accent) 55%,var(--line))}
  .steps.rej .step,.steps.rej .bar{opacity:.45}
  .steps .term{font-size:11.5px;font-weight:700;border-radius:20px;padding:2px 10px;margin-left:12px}
  .steps .term.tdone{color:var(--lane-5);border:1px solid color-mix(in srgb,var(--lane-5) 45%,transparent);background:color-mix(in srgb,var(--lane-5) 10%,transparent)}
  .steps .term.trej{color:var(--lane-4);border:1px solid color-mix(in srgb,var(--lane-4) 45%,transparent);background:color-mix(in srgb,var(--lane-4) 10%,transparent)}
  /* meta row: every pill labeled, deps navigable, dates dim right */
  .imeta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px}
  .imeta-row .ml{font-size:11px;color:var(--ink-3)}
  .imeta-row .ml:not(:first-child){margin-left:6px}
  .imeta-row .mdim{color:var(--ink-3);font-size:12px;margin-left:auto}
  .imeta-row .dep-l{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);background:transparent;border:none;cursor:pointer;padding:0}
  .imeta-row .dep-l:hover{text-decoration:underline}
  .imeta-row .dep-x{font-family:var(--mono);font-size:12px;color:var(--ink-3)}
  .idd-grid{display:grid;grid-template-columns:minmax(0,6fr) minmax(0,5fr);gap:32px;align-items:start;margin-top:16px}
  @media (max-width:1100px){.idd-grid{grid-template-columns:1fr}}
  /* description halves live at the top of the two body columns (plain left,
     technical right) so each column flows with no cross-column gap */
  .dplain{font-size:15.5px;color:var(--ink-2);line-height:1.6;margin:6px 0 20px;white-space:pre-line}
  .dtech{border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--panel) 60%,var(--ground));padding:14px 16px;margin-bottom:16px}
  .dtech h4{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 7px;font-weight:600}
  .dtech p{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:0;white-space:pre-line}
  .idd-block{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:16px 18px;margin-bottom:16px}
  .idd-block h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin:0 0 10px;font-weight:600;display:flex;align-items:center;gap:8px}
  .idd-block h3 .eb{margin-left:auto;font-size:12px;font-weight:500;color:var(--accent);background:transparent;border:none;cursor:pointer;letter-spacing:0;text-transform:none}
  .idd-block h3 .eb:hover{text-decoration:underline}
  .idd-block p, .idd-block li{font-size:15px;line-height:1.6;color:var(--ink)}
  .idd-block p{margin:0 0 8px;white-space:pre-wrap}   /* the grid column is the measure */
  .idd-block.loose{background:transparent;border:none;padding:6px 2px}
  .idd-block.lead{background:transparent;border:none;padding:0 2px;margin-bottom:14px}
  .idd-block.lead h3{opacity:0;transition:opacity .12s}
  .idd-block.lead:hover h3, .idd-block.lead:focus-within h3{opacity:1}
  .ilab{display:block;font-size:11.5px;color:var(--ink-3);margin:10px 0 4px}
  .ilab:first-child{margin-top:0}
  .promote-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
  .idd h2 input{font:inherit;font-size:24px;letter-spacing:-.02em;color:var(--ink);width:100%;
    background:var(--card-2);border:1px solid var(--accent);border-radius:8px;padding:2px 8px}
  .idd h2{cursor:text}
  .idd-block .empty{color:var(--ink-3);font-size:14px;font-style:italic}
  .idd-block textarea{width:100%;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--card-2);
    border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:90px;resize:vertical;line-height:1.55}
  .idd-block input[type=text]{width:100%;font-family:var(--sans);font-size:14.5px;color:var(--ink);background:var(--card-2);
    border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .procon{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .procon h4{font-size:12.5px;margin:0 0 7px;color:var(--ink-2);font-weight:600}
  .procon ul{margin:0;padding-left:18px}
  .procon li{margin-bottom:5px}
  .procon li.pro::marker{color:var(--lane-5)} .procon li.con::marker{color:var(--lane-4)}
  /* the decision lens gets the accent treatment — it's the point of the page */
  .lens{border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
  .lens .lrow{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:12px}
  .lens .lsel{display:flex;flex-direction:column;gap:6px}
  .lens .lsel label{font-size:12px;color:var(--ink-3);font-weight:500}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{font-family:var(--sans);font-size:13px;font-weight:500;padding:6px 12px;background:var(--card-2);color:var(--ink-2);border:none;border-right:1px solid var(--line);cursor:pointer;transition:all .1s ease}
  .seg button:last-child{border-right:none}
  .seg button:hover{color:var(--ink)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
  .seg button[data-v=""][aria-pressed="true"]{background:var(--line);color:var(--ink-2)} /* unset stays neutral — accent is for real ratings */
  :root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1F1F1F}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .seg button[aria-pressed="true"]{color:#1F1F1F}}
  .lens .verdict{margin:0 0 14px;font-size:13.5px;font-weight:600;display:inline-block}
  .lens .verdict.quiet{color:var(--ink-2);font-weight:500}
  .lens .verdict.hint{color:var(--ink-3);font-style:italic;font-weight:400}
  button:focus-visible,.chip:focus-visible,.idea:focus-visible,.scard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .idd-log{list-style:none;margin:0;padding:0}
  .idd-log li{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:14px}
  .idd-log li:last-child{border-bottom:none}
  .idd-log .lat{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex:0 0 auto;padding-top:2px}
  .idd-log .lnote{color:var(--ink);line-height:1.5;white-space:pre-wrap}
  .logadd{display:flex;gap:8px;margin-top:10px}
  .logadd input{flex:1 1 auto}
  .sec-item{border-top:1px solid var(--line-2);padding-top:12px;margin-top:12px}
  .sec-item:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .sec-item h4{font-size:14px;margin:0 0 6px;color:var(--ink);display:flex;align-items:center}
  .sec-item h4 .eb{margin-left:auto;font-size:12px;font-weight:500;color:var(--accent);background:transparent;border:none;cursor:pointer}
  .sec-item h4 .eb:hover{text-decoration:underline}
  .card.flash, .idea.flash, .scard.flash{border-color:var(--accent)!important;box-shadow:0 0 0 3px var(--accent-soft)}
  @media (max-width:820px){.ideas-cols{grid-template-columns:1fr}}

  /* ---- docs (capabilities rendered in-UI) ---- */
  .docs-grid{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:44px;align-items:start}
  .docs-grid .toc{grid-column:2;grid-row:1}
  .docs-grid .mdoc{grid-column:1;grid-row:1}
  .toc{position:sticky;top:0;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 14px 10px;font-size:13.5px}
  .toc .toc-t{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:600;margin:0 0 8px 8px}
  .toc a{display:block;color:var(--ink-2);text-decoration:none;padding:5px 8px;margin-bottom:2px;
    border-left:2px solid transparent;border-radius:0 6px 6px 0;line-height:1.35;cursor:pointer}
  .toc a:hover{color:var(--ink);background:var(--card-2)}
  .toc a.on{color:var(--accent);border-left-color:var(--accent);background:var(--accent-soft)}
  @media (max-width:1100px){.docs-grid{grid-template-columns:1fr}
    .docs-grid .toc{grid-column:1;grid-row:1;position:static;margin-bottom:20px}
    .docs-grid .mdoc{grid-column:1;grid-row:2}}
  .mdoc{max-width:none}
  .mdoc h1{font-size:24px;letter-spacing:-.02em;margin:0 0 10px}
  .mdoc h2{font-size:17px;letter-spacing:-.01em;margin:26px 0 8px}
  .mdoc h3{font-size:14px;margin:18px 0 6px}
  .mdoc p{font-size:15px;line-height:1.65;color:var(--ink);margin:0 0 10px}
  .mdoc em{color:var(--ink-2)}
  .mdoc ul{margin:0 0 10px;padding-left:22px}
  .mdoc li{font-size:15px;line-height:1.6;margin-bottom:8px}
  .mdoc code{font-family:var(--mono);font-size:13px;background:var(--card-2);border:1px solid var(--line-2);border-radius:5px;padding:1px 5px}
  .mdoc a{color:var(--accent);text-decoration:none}
  .mdoc a:hover{text-decoration:underline}
  .mdoc hr{border:none;border-top:1px solid var(--line-2);margin:20px 0}
  /* section cards: each h2 section is a panel with a cycling lane accent */
  .dsec{border:1px solid var(--line);border-left:3px solid var(--sc);border-radius:12px;background:var(--panel);
    padding:18px 22px 12px;margin:0 0 14px}
  .dsec>h2{margin:0 0 12px;font-size:16px;color:var(--sc);display:flex;align-items:center;gap:9px}
  .dsec>h2::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--sc);flex:0 0 auto}
  .dsec li::marker{color:var(--sc)}
  .dsec p:last-child,.dsec ul:last-child{margin-bottom:2px}
  .mdoc .dterm{color:var(--sc,var(--accent));font-weight:650}

  /* ---- modal ---- */
  .scrim{position:fixed;inset:0;background:rgba(6,14,17,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:50}
  .scrim.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    width:min(560px,100%);max-height:90vh;overflow:auto;padding:22px 24px}
  .modal h2{margin:0;font-size:16px;display:flex;align-items:center;gap:10px}
  .modal h2 .id{font-family:var(--mono);color:var(--accent);font-size:14px}
  .field{margin-top:15px}
  .field label{font-size:12.5px;font-weight:500;color:var(--ink-3);display:block;margin-bottom:6px}
  .field input,.field textarea,.field select{width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);
    background:var(--card-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .field input[readonly]{color:var(--ink-3);cursor:not-allowed}
  .field textarea{min-height:88px;resize:vertical;line-height:1.5}
  .field.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field.mono input{font-family:var(--mono);font-size:13px}

  /* ---- wide modal: a card you read, not a form you fill ----
     The old 560px column gave `Systems involved` a full-width input and
     acceptance criteria a 70px box you scrolled inside — exactly backwards.
     Content takes the wide column and sizes to itself; everything that is a
     one-word decision (kind, lane, priority, claim) goes to a rail. */
  .modal.wide{width:min(940px,100%);padding:0}
  .mhead{padding:20px 26px 16px;border-bottom:1px solid var(--line-2);position:sticky;top:0;background:var(--panel);z-index:1;border-radius:14px 14px 0 0}
  .mhead .mh-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .mhead .id{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent)}
  .mhead .sstate{margin-left:0}
  .mhead .mh-where{margin-left:auto;font-size:12px;color:var(--ink-3)}
  .mhead .mh-where b{color:var(--ink-2);font-weight:600}
  /* The name is the title: it reads as a heading and edits as an input. */
  .mhead .mh-name{width:100%;margin-top:9px;font-family:var(--sans);font-size:19px;font-weight:600;line-height:1.3;
    color:var(--ink);background:transparent;border:1px solid transparent;border-radius:8px;padding:4px 7px;margin-left:-7px}
  .mhead .mh-name:hover{border-color:var(--line)}
  .mhead .mh-name:focus{background:var(--card-2);border-color:var(--accent);outline:none}
  /* The question this lane asks — the modal's own reason for its order. */
  .mhead .mh-ask{display:block;margin-top:7px;font-size:12.5px;color:var(--ink-3)}
  .mhead .mh-ask b{color:var(--lc,var(--accent));font-weight:600}
  .mgrid{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:0;align-items:start}
  .mgrid .mcol{padding:18px 26px 8px;min-width:0}
  .mgrid .mrail{padding:18px 26px 8px;border-left:1px solid var(--line-2);background:var(--card-2);min-width:0;align-self:stretch}
  @media (max-width:820px){
    .mgrid{grid-template-columns:1fr}
    .mgrid .mrail{border-left:0;border-top:1px solid var(--line-2)}
  }
  .mgrid .field:first-child{margin-top:0}
  /* Section headings, not form labels: the block below is content. */
  .mgrid .field > label:not(.rdy-t),.mrail .rlab{font-size:11px;text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--ink-3)}
  /* The ready flag is a decision, not a section: checkbox first, sentence after. */
  .mgrid label.rdy-t{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer;margin:0}
  .mgrid label.rdy-t input{width:auto;flex:0 0 auto;margin:0}
  .mgrid .field > label .ct{text-transform:none;letter-spacing:0;color:var(--ink-3);font-weight:500}
  .mrail .rlab{display:block;margin-bottom:6px}
  .mrail .rgroup{margin-top:16px}
  .mrail .rgroup:first-child{margin-top:0}
  .mrail .rfact{font-size:13px;line-height:1.5;color:var(--ink-2)}
  .mrail .rfact .dim{color:var(--ink-3)}
  .mrail .rfact b{color:var(--ink);font-weight:600}
  .mrail .field{margin-top:12px}
  /* Textareas grow to their content (autoGrow) — no scrollbar inside a
     scrollbar, and the whole criterion list is visible at once. */
  .modal.wide textarea{min-height:0;overflow:hidden;resize:none}
  /* Criteria are a list, so they render as one. A textarea cannot mark where
     one criterion ends and the next begins once they wrap — and wrapping is
     the normal case here, not the exception. Click "edit" for the raw lines. */
  .aclist{margin:0;padding:0;list-style:none}
  .aclist li{position:relative;padding:0 0 0 20px;margin-bottom:9px;font-size:14.5px;line-height:1.55;color:var(--ink)}
  .aclist li::before{content:"";position:absolute;left:4px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--lc,var(--accent))}
  .aclist li:last-child{margin-bottom:2px}
  .field > label .eb{float:right;font-size:11.5px;font-weight:500;color:var(--accent);background:none;border:0;
    cursor:pointer;text-transform:none;letter-spacing:0;padding:0}
  .field > label .eb:hover{text-decoration:underline}
  /* Save stays reachable: a long card scrolls under a pinned action bar
     rather than pushing it past the fold. */
  .modal.wide .actions{margin:0;padding:14px 26px;border-top:1px solid var(--line-2);
    position:sticky;bottom:0;background:var(--panel);border-radius:0 0 14px 14px}
  .modal.wide .m-err{padding:0 26px}
  .modal.wide #m-stories{max-height:none}
  /* ---- peek: dwell on a card, read it without opening it ----
     Deliberately not a title tooltip: those are unstyled, truncate, and
     cannot show the computed state. Deliberately not instant either — a
     popover that fires while you sweep the board is noise, so it waits for
     a dwell that means "this one". */
  .peek{position:fixed;z-index:60;width:min(400px,calc(100vw - 32px));max-height:60vh;overflow:auto;
    background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--pc,var(--accent));
    border-radius:10px;box-shadow:var(--shadow);padding:13px 15px;pointer-events:none;
    opacity:0;transform:translateY(3px);transition:opacity .12s ease,transform .12s ease}
  .peek.on{opacity:1;transform:none}
  .peek h4{margin:0 0 3px;font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
  .peek .pkid{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--accent)}
  .peek .pkhead{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .peek .pkhead .sstate{margin-left:auto}
  .peek .pkwhere{font-size:11px;color:var(--ink-3)}
  .peek p{margin:0 0 8px;font-size:12.5px;line-height:1.55;color:var(--ink-2);white-space:pre-wrap}
  .peek .pksec{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
    font-weight:600;margin:10px 0 5px}
  .peek ul{margin:0;padding:0;list-style:none}
  .peek li{position:relative;padding-left:15px;margin-bottom:5px;font-size:12.5px;line-height:1.5;color:var(--ink-2)}
  .peek li::before{content:"";position:absolute;left:2px;top:8px;width:4px;height:4px;border-radius:50%;background:var(--pc,var(--accent))}
  .peek .pkmore{font-size:11.5px;color:var(--ink-3);font-style:italic}
  .peek .pkfoot{margin-top:10px;padding-top:8px;border-top:1px solid var(--line-2);
    font-size:11px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
  @media (prefers-reduced-motion:reduce){.peek{transition:none}}
  .themet{font-size:14px;line-height:1;padding:5px 8px;border-radius:7px;cursor:pointer;
    border:1px solid var(--line);background:var(--panel);color:var(--ink-3)}
  .themet:hover{border-color:var(--accent);color:var(--accent)}
  .actions{display:flex;gap:10px;margin-top:22px;align-items:center;flex-wrap:wrap}
  .btn{font-family:var(--sans);font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--line);
    background:var(--card-2);color:var(--ink);cursor:pointer}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.danger{border-color:color-mix(in srgb,var(--lane-4) 50%,transparent);color:var(--lane-4);background:transparent;margin-left:auto}
  .btn.danger:hover{background:color-mix(in srgb,var(--lane-4) 12%,transparent)}
  :root[data-theme="dark"] .btn.primary{color:#1F1F1F}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#1F1F1F}}
  .btn:focus-visible,.card:focus-visible,.chip:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .m-err{font-size:12.5px;color:var(--lane-4);min-height:16px;margin-top:8px}

  footer{flex:0 0 auto;padding:9px 22px;border-top:1px solid var(--line-2);font-size:12px;color:var(--ink-3);
    display:flex;gap:16px;flex-wrap:wrap}
  footer b{color:var(--ink-2)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);max-width:min(560px,92vw);
    background:var(--panel);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--lane-4);
    border-radius:10px;padding:12px 16px;font-size:13.5px;line-height:1.45;box-shadow:var(--shadow);
    opacity:0;pointer-events:none;transition:opacity .18s ease,transform .18s ease;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ---- history (git log as a page) ---- */
  .htl{max-width:860px}
  .hentry{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:10px}
  .hrowline{display:flex;align-items:baseline;gap:12px;padding:12px 16px;cursor:pointer;flex-wrap:wrap}
  .hrowline:hover .hmsg{color:var(--accent)}
  .hdate{font-family:var(--mono);font-size:12px;color:var(--ink-3);flex:0 0 auto}
  .hmsg{font-size:14px;font-weight:600;color:var(--ink)}
  .hfiles{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}
  .harrow{color:var(--ink-3);font-size:12px}
  .hchanges{padding:4px 16px 12px;border-top:1px solid var(--line-2)}
  .hline{font-size:13px;color:var(--ink-2);padding:5px 0;border-bottom:1px solid var(--line-2);line-height:1.45}
  .hline:last-child{border-bottom:0}
  .hempty{font-size:13.5px;color:var(--ink-3)}

  /* ---- board briefing (since you last looked) ---- */
  .briefing[hidden]{display:none}   /* the flex display must not defeat the hidden attribute */
  .briefing{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:10px 22px 0;
    padding:10px 16px;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);
    border-radius:10px;font-size:13.5px;color:var(--ink)}
  .brf-sum b{font-weight:700}
  .brf-body{flex-basis:100%;border-top:1px solid var(--line-2);margin-top:6px;padding-top:4px}
  .brf-body h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
    margin:10px 0 4px;font-weight:700}

  /* ---- command palette ---- */
  .scrim.pal{align-items:flex-start;justify-content:center}
  .palette{width:min(560px,92vw);margin-top:12vh;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .palette input{width:100%;border:0;outline:0;background:none;color:var(--ink);font:inherit;
    font-size:15px;padding:15px 18px;border-bottom:1px solid var(--line-2)}
  .pal-results{max-height:46vh;overflow:auto;padding:6px}
  .pal-row{display:flex;align-items:baseline;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer}
  .pal-row.sel, .pal-row:hover{background:var(--accent-soft)}
  .pal-row .pt{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);
    border:1px solid var(--line);border-radius:20px;padding:1px 7px;flex:0 0 auto}
  .pal-row .pid{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);flex:0 0 auto}
  .pal-row .pnm{font-size:13.5px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pal-none{font-size:13px;color:var(--ink-3);padding:10px 12px}

  /* ---- live-refresh motion: agent changes read as pick-up → glide → set-down ----
     The transition lives on the class so the reduced-motion media query
     (transition:none!important) collapses it back to today's instant snap. */
  .agent-lift{position:relative;z-index:40;box-shadow:var(--shadow)!important;
    transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  @keyframes agent-new{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
  .agent-new{animation:agent-new .3s ease}

  /* ---- pending ratification (review panel) ---- */
  .pbadge{display:none;font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--lane-2);
    border:1px solid color-mix(in srgb,var(--lane-2) 45%,transparent);border-radius:20px;padding:2px 9px;
    background:color-mix(in srgb,var(--lane-2) 10%,transparent);cursor:pointer}
  .pbadge.on{display:inline-block}
  .ppanel{position:fixed;top:0;right:0;bottom:0;width:min(440px,92vw);background:var(--panel);
    border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(105%);
    transition:transform .18s ease;z-index:60;display:flex;flex-direction:column}
  .ppanel.on{transform:none}
  .pp-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line-2)}
  .pp-head h2{font-size:15.5px;margin:0}
  .pp-x{margin-left:auto;border:0;background:none;color:var(--ink-3);font-size:15px;cursor:pointer;padding:4px}
  .pp-x:hover{color:var(--ink)}
  .pp-body{overflow:auto;padding:14px 18px;flex:1}
  .pp-group h4{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);
    margin:14px 0 6px;font-weight:700;display:flex;gap:7px}
  .pp-group:first-child h4{margin-top:0}
  .pp-group .cnt{font-family:var(--mono);font-weight:500}
  .pp-line{font-size:13px;color:var(--ink-2);padding:5px 0;border-bottom:1px solid var(--line-2);line-height:1.45}
  .pp-files{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:14px}
  .pp-empty{font-size:13.5px;color:var(--ink-3);padding:8px 0}
  .pp-foot{padding:12px 18px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--ink-3)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <header>
    <div class="hrow">
      <span class="eyebrow">Local · agent-board</span>
      <h1 id="board-title">Board</h1>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Views"></nav>
      <div class="sub">
        <span id="counts"></span>
        <button class="themet" id="theme-t" type="button" aria-label="Switch colour theme"></button>
        <span class="save" id="save"><span class="d"></span><span id="save-t">saved</span></span>
        <button class="pbadge" id="pending-badge" type="button" title="Uncommitted board changes — click to review what a 'save' would ratify"></button>
      </div>
    </div>
  </header>

  <div class="briefing" id="briefing" hidden>
    <span class="brf-sum" id="brf-sum"></span>
    <button class="chip" id="brf-view" type="button">view</button>
    <button class="chip" id="brf-dismiss" type="button">dismiss</button>
    <div class="brf-body" id="brf-body" hidden></div>
  </div>

  <section class="view" id="view-execution" hidden>
    <div class="filters" id="filters"></div>
    <div class="readyq" id="workq"></div>
    <main class="exec" id="exec" aria-label="Execution kanban"></main>
  </section>
  <section class="view scroll" id="view-milestones" hidden></section>
  <section class="view scroll" id="view-ideas" hidden></section>
  <section class="view scroll" id="view-history" hidden></section>
  <section class="view scroll" id="view-docs" hidden></section>

  <footer>
    <span id="footer-note"></span>
    <span id="stories-note"></span>
    <span style="margin-left:auto">data → <b id="data-path">./data</b></span>
  </footer>

  <div class="scrim pal" id="pal-scrim">
    <div class="palette" id="palette" role="dialog" aria-label="Command palette">
      <input id="pal-input" type="text" placeholder="Jump to any epic, story, or idea…" autocomplete="off" spellcheck="false">
      <div class="pal-results" id="pal-results"></div>
    </div>
  </div>

  <aside class="ppanel" id="pending-panel" aria-label="Pending ratification">
    <div class="pp-head"><h2>Pending ratification</h2>
      <button class="pp-x" id="pp-close" type="button" title="Close">✕</button></div>
    <div class="pp-body"></div>
    <div class="pp-foot">Reviewing only — say <b>"save"</b> in conversation (or commit the data dir) to ratify.</div>
  </aside>

  <div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <div class="modal" id="modal"></div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const opts = (arr,sel) => arr.map(x=>'<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>').join("");
const today = () => new Date().toISOString().slice(0,10);

let state = { epics: [], stories: [], ideas: [], config: {}, milestones: { overview: null, milestones: [] } };
let COLUMNS = [], PRIOS = [], THEMES = [], MILESTONES = [];
let filterMS = "all", filterTheme = "all", filterTag = "all";
let boardMode = "epics";   // "epics" (columns of epic cards) | "rows" (story swimlanes by epic)
let boardArchive = false;  // false = current work, true = the Shipped view (archived_at epics)
let moreFilters = false;   // taxonomy stays hidden until asked for — the board is for execution
const expandedRows = new Set();   // finished epics the human opened back up
const expandedDone = new Set();   // rows whose done column was expanded
// Completed work is the least demanding thing on the board; it summarises
// unless asked for. Epic-level counts the row header reports.
function epicRollup(e, st){
  const done = st.filter(s => s.column === doneLane()).length;
  const ready = st.filter(s => s.ready && s.column === COLUMNS[0] && !s.claimed_by).length;
  const stuck = st.filter(s => s.needs && s.column !== doneLane()).length;
  const pct = st.length ? Math.round(done/st.length*100) : 0;
  return '<span class="eroll">'+
    '<span class="bar" title="'+pct+'% complete"><i style="width:'+pct+'%"></i></span>'+
    done+'/'+st.length+' done'+
    (ready ? ' · <b class="rdy">'+ready+' ready</b>' : '')+
    (stuck ? ' · <b class="needs">'+stuck+' needs you</b>' : '')+'</span>';
}
let modalMode = "edit";
let editingId = null;
const byId = () => Object.fromEntries(state.epics.map(e => [e.id, e]));
// Lane colour is positional and semantic, never keyed to lane *names* —
// projects define their own vocabulary. First lane is queued (gray), the
// last is done (green), the one before it reads as verification (amber)
// once a board has a dedicated review lane, and everything between is
// active work (accent).
function laneVar(col){
  const i = COLUMNS.indexOf(col), n = COLUMNS.length;
  if(i <= 0) return "var(--st-idle)";
  if(i === n-1) return "var(--st-ready)";
  if(col === reviewLane()) return "var(--st-blocked)";
  return "var(--accent)";
}
// A promoted epic arrives with no stories: committed, but not yet
// broken down. Say so rather than letting it look ready.
function needsGrooming(e){
  return e.column === COLUMNS[0] && !e.archived_at && storiesOf(e.id).length === 0;
}
const prioClass = p => "p"+Math.max(0, PRIOS.indexOf(p));
const storiesOf = id => state.stories.filter(s => s.epic_id === id);
// "M0 Reliable foundation" -> "M0", "Phase 2 The story…" -> "Phase 2"; no code prefix -> full string
function short(s){
  const t = (s||"").split(" ");
  if(/\d/.test(t[0])) return t[0];
  if(t[1] && /^\d/.test(t[1])) return t[0]+" "+t[1];
  return s||"";
}

/* ---- dependency ordering guard ---- */
// The last configured lane is the "done" lane; a card can't enter it until
// every dependency has, and a dependency can't leave it while a dependent
// is already there.
function doneLane(){ return COLUMNS[COLUMNS.length-1]; }
// The lane before done reads as verification once a board has a dedicated
// review lane — one positional rule, never keyed to lane *names*, feeding
// both the lane colour and the story's copy. Three lanes or fewer: none.
function reviewLane(){ return COLUMNS.length > 3 ? COLUMNS[COLUMNS.length-2] : null; }
// A card asks a different question in each lane, so opening it should lead
// with a different thing. Queued: can this be started? In flight: who has it?
// Review: what should I check — so the criteria become the checklist and
// come first. Done: what shipped. Positional like every other lane rule, so
// a project's own lane names work unchanged; nothing is ever hidden, only
// ordered — you can still edit any field from any lane.
function laneFocus(x){
  const i = COLUMNS.indexOf(x.column), last = COLUMNS.length-1;
  if(i <= 0)                  return { key:"queued",  ask:"Can an agent start this?",        criteriaFirst:false };
  if(x.column === reviewLane())return{ key:"review",  ask:"What should a reviewer check?",   criteriaFirst:true  };
  if(i === last)              return { key:"done",    ask:"What shipped?",                   criteriaFirst:true  };
  return                             { key:"flight",  ask:"Who has this, and how far along?",criteriaFirst:false };
}
function depsOf(e){ return (e.deps||[]).map(d=>byId()[d]).filter(Boolean); }
// One chip per dependency, coloured by that dep's own state, so you can
// see *which* of several cleared. Unknown ids are shown, never dropped.
// `soft` (ideas) keeps unresolved deps dim: idea deps are informational
// sequencing with no ordering rule, so they must not look like violations.
function depChips(ids, soft){
  return (ids||[]).map(id => {
    const d = byId()[id] || (typeof ideaById === "function" ? ideaById(id) : null);
    if(!d) return '<span class="depid unknown" title="'+esc(id)+' — no card or idea with this id">'+esc(id)+'</span>';
    const met = d.column ? d.column === doneLane() : ideaStatus(d) === "done";
    const where = d.column || ideaStatus(d);
    return '<span class="depid '+(met ? "met" : (soft ? "unknown" : "unmet"))+'" title="'+
      esc(id + " — " + (met ? "done" : "still in " + where))+'">'+(met?"✓":"")+esc(id)+'</span>';
  }).join("");
}
// "Every dependency landed and nothing else stops a start" — deliberately
// narrower than "no deps": this marks the transition, not an empty queue.
// ---- idea state, the one source the visual language reads ----
// Workflow state → the left border and status pill. Exactly one per card;
// anything orthogonal (blocked, conviction) renders as a separate pill so
// no single channel carries two meanings (design/system.md legend).
function ideaCardState(i){
  const st = ideaStatus(i);
  if(st === "done")     return { key:"done",     label:"done",           title:"Shipped or promoted to execution" };
  if(st === "rejected") return { key:"rejected", label:"rejected",       title:"Declined — see the reason on the deep dive" };
  if(st === "ready to implement") return { key:"ready", label:"ready to implement", title:"Intent settled — ready to promote to Execution" };
  if(st === "ready for review")   return { key:"review", label:"ready for review",  title:"Shaped enough — awaiting a deliberate product decision" };
  const ix = PRIOS.indexOf(i.priority), cut = Math.ceil(PRIOS.length/2);
  return (ix > -1 && ix < cut)
    ? { key:"front", label:"front burner", title:"Actively being explored ("+i.priority+")" }
    : { key:"idle",  label:"back burner",  title:"Parked on purpose"+(i.priority?" ("+i.priority+")":"") };
}
// A dep is resolved when the epic reached the done lane, or the idea is done.
function depResolved(id){
  const ep = byId()[id]; if(ep) return ep.column === doneLane();
  const other = ideaById(id); return other ? ideaStatus(other) === "done" : false;
}
// Leverage: the inverse of deps. Foundational work looks foundational.
function unlockedBy(id){
  return (state.ideas||[]).filter(x =>
    !IDEA_STATUS_ARCHIVE.includes(ideaStatus(x)) && (x.deps||[]).includes(id));
}
// One sentence of outcome — derived, so no new field and existing ideas
// benefit immediately. Full prose stays on the deep dive.
function outcomeLine(i){
  const plain = descParts(i.description).plain.trim();
  if(!plain) return "";
  const m = plain.match(/^[\s\S]*?[.!?](?=\s|$)/);
  return (m ? m[0] : plain).trim();
}
function epicUnblocked(e){
  if(!(e.deps||[]).length) return false;
  if(e.column !== COLUMNS[0] || e.claimed_by || !gateOpen(e)) return false;
  return (e.deps||[]).every(id => { const d = byId()[id]; return d && d.column === doneLane(); });
}
function checkMove(e, target){
  if(target === doneLane()){
    const waiting = depsOf(e).filter(d => d.column !== doneLane());
    if(waiting.length) return { ok:false,
      reason: e.id+" can't enter "+target+" — waiting on "+waiting.map(d=>d.id+" ("+d.column+")").join(", ")+" to reach "+doneLane()+"." };
  }
  if(target !== doneLane()){
    const shipped = state.epics.filter(x => (x.deps||[]).includes(e.id) && x.column === doneLane());
    if(shipped.length) return { ok:false,
      reason: e.id+" can't move to "+target+" — "+shipped.map(d=>d.id).join(", ")+" depend on it and are already "+doneLane()+". Move them back first." };
  }
  return { ok:true };
}

/* ---- next up: the selection rule (PROTOCOL §3), rendered ---- */
function unblockCount(id){ return state.epics.filter(x => (x.deps||[]).includes(id)).length; }
function gateOpen(e){ return !e.gate || e.gate==="none" || (state.config.open_gates||[]).includes(e.gate); }
// A pick would move into the first lane's successor; if that lane has a
// configured wip_limit and is full, nothing is pickable (PROTOCOL §3.5).
function wipBlocked(){
  const lane = COLUMNS[1];
  const lim = (state.config.wip_limits||{})[lane];
  return !!lane && lim != null && state.epics.filter(e => e.column===lane).length >= lim;
}
function nextUp(){
  const first = COLUMNS[0];
  const notes = { deps:0, gate:0, claim:0 };
  const picks = [];
  state.epics.forEach((e, ix) => {
    if(e.column !== first) return;
    if(depsOf(e).some(d => d.column !== doneLane())){ notes.deps++; return; }
    if(!gateOpen(e)){ notes.gate++; return; }
    if(e.claimed_by){ notes.claim++; return; }
    picks.push({ e, ix, p: Math.max(0, PRIOS.indexOf(e.priority)), u: unblockCount(e.id) });
  });
  picks.sort((a,b) => a.p - b.p || b.u - a.u || a.ix - b.ix);
  return { picks: wipBlocked() ? [] : picks, notes, wip: wipBlocked() };
}
// One display state per story from one rule: lane + ready + claim + epic
// health. Every surface renders this — no surface may read `ready`
// without also reading the lane (the "✓ ready in Done" bug, twice fixed,
// now impossible by construction). Pooled labels pick by a stable id
// hash: variety across the board, stability across re-renders.
function hashPick(id, pool){
  let h = 0;
  for(const c of id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return pool[h % pool.length];
}
const KIND_VERB = { feature:"cooking", test:"testing", chore:"tidying up", docs:"writing", integration:"wiring up" };
// Review's own register: the work is built, so the verb describes what is
// waiting to be looked at, not what is still being made.
const REVIEW_VERB = { feature:"ready to check", test:"results in", chore:"ready to check",
                      docs:"ready to read", integration:"wired — verify" };
const DONE_POOL = ["✓ shipped", "✓ plated", "✓ in the books"];
// "Waiting on you" is not "blocked" — a dependency resolves itself when
// other work lands, but this one only moves when a human answers. It
// outranks every other state because it is the only one asking for you.
function needsBit(x){
  const n = x && x.needs;
  if(!n || x.column === doneLane()) return null;
  const kind = (typeof n === "string") ? "decision" : (n.kind || "decision");
  const reason = (typeof n === "string") ? n : (n.reason || "");
  return { cls:"warn", label:"⚠ needs "+kind, reason,
           title:"Waiting on you — "+(reason || "no reason recorded") };
}
function storyState(s){
  const done = doneLane();
  const needs = needsBit(s);
  if(needs) return needs;
  // Before the lane's own story: a claim old enough to be suspect is the
  // more useful fact — "cooking" for three days is not cooking.
  if(claimIsStale(s))
    return { cls:"warn", label:"⚠ stale claim · "+sinceLabel(s.claimed_at), title:claimTitle(s) };
  if(s.column === done){
    const waiting = storiesOf(s.epic_id).filter(x => x.id !== s.id && x.column !== done).map(x => x.id);
    if(waiting.length)
      return { cls:"ok", label:"✓ done · waiting on "+waiting[0]+(waiting.length>1?" +"+(waiting.length-1):""),
               title:"finished — the epic ships when "+waiting.join(", ")+" land"+(waiting.length===1?"s":"") };
    return { cls:"ok", label: hashPick(s.id, DONE_POOL), title:"done — epic complete" };
  }
  // Review is not "in flight": the work is built and waiting on a look. A
  // claim here names the reviewer, which outranks what is being reviewed —
  // who has it is the more useful fact once the making is finished.
  if(s.column === reviewLane()){
    const who = s.claimed_by
      ? "in review · "+s.claimed_by+(sinceLabel(s.claimed_at) ? " · "+sinceLabel(s.claimed_at) : "")
      : (REVIEW_VERB[s.kind] || "ready to check");
    return { cls:"rev", label:"⚑ "+who,
             title: s.claimed_by ? claimTitle(s) : s.column+" — built, waiting on a review" };
  }
  if(s.column !== COLUMNS[0]){
    return { cls:"act", label:"⚙ "+(KIND_VERB[s.kind] || "cooking"),
             title: s.column + (s.claimed_by ? " · claimed by "+s.claimed_by : "") };
  }
  if(!s.ready) return { cls:"dim", label:"needs prep", title:"not groomed to ready yet — the human's flag" };
  const ep = byId()[s.epic_id];
  if(ep && !gateOpen(ep))
    return { cls:"warn", label:"⛔ gated: "+ep.gate, title:"a human opens '"+ep.gate+"' in config.json open_gates" };
  if(ep){
    const unmet = depsOf(ep).filter(d => d.column !== done).map(d => d.id);
    if(unmet.length)
      return { cls:"warn", label:"⏳ waiting on "+unmet.join(" "), title:"epic blocked until "+unmet.join(", ")+" is done" };
  }
  if(s.claimed_by)
    return { cls:"act", label:"claimed"+(sinceLabel(s.claimed_at)?" · "+sinceLabel(s.claimed_at):""), title:claimTitle(s) };
  return { cls:"ok", label:"✓ ready", title:"Definition of ready: enough context for an agent to build this" };
}
function stateChip(s){
  const st = storyState(s);
  return '<span class="sstate '+st.cls+'" title="'+esc(st.title)+'">'+esc(st.label)+'</span>';
}
// The reason belongs on the card, not only in a tooltip — that's the
// whole point: you should be able to answer it without opening anything.
function needsLine(x){
  const n = needsBit(x);
  return n && n.reason ? '<div class="needsline">'+esc(n.reason)+'</div>' : "";
}

// Story-grain PROTOCOL §3 — the "begin X" menu. A story is pickable when
// ready (the human's flag), sitting in the first lane, unclaimed, and its
// epic is ungated with all deps done. Board-wide, like Next up.
function readyQueue(){
  const first = COLUMNS[0];
  const epicIx = new Map(state.epics.map((e, i) => [e.id, i]));
  const picks = [];
  let readyButStuck = 0;
  state.stories.forEach((s, ix) => {
    if(!s.ready || s.column === doneLane()) return;   // finished ≠ stuck
    if(s.column !== first || s.claimed_by){ readyButStuck++; return; }
    const ep = byId()[s.epic_id];
    if(!ep || ep.archived_at) return;            // shipped and closed — not pickable
    if(!gateOpen(ep) || depsOf(ep).some(d => d.column !== doneLane())){ readyButStuck++; return; }
    picks.push({ s, ep, ix, p: Math.max(0, PRIOS.indexOf(s.priority)), er: epicIx.get(ep.id) });
  });
  picks.sort((a,b) => a.p - b.p || a.er - b.er || a.ix - b.ix);
  return { picks, readyButStuck };
}
// ---- the work queue: one strip, one answer ----
// Next up (epic-grain) and Ready (story-grain) used to answer "what now"
// separately, so the board could say "nothing pickable" directly above
// three ready stories. This reports the single most actionable state,
// and names who owns whatever is already moving.
function inFlight(){
  return (state.stories||[]).filter(s => {
    const ep = byId()[s.epic_id];
    if(!ep || ep.archived_at) return false;      // shipped and closed — not work
    return s.claimed_by && s.column !== doneLane() && s.column !== COLUMNS[0];
  });
}
function sinceLabel(iso){
  const t = Date.parse(iso||""); if(isNaN(t)) return "";
  const m = Math.max(0, Math.round((Date.now()-t)/60000));
  if(m < 60) return m+"m ago";
  const h = Math.round(m/60); return h < 24 ? h+"h ago" : Math.round(h/24)+"d ago";
}
// A claim older than this is *suspect*, never wrong: a long-running job and
// an abandoned one look identical from outside, so the board flags it and a
// human decides. Nothing here ever clears a claim by itself.
const CLAIM_STALE_MS = 48*3600*1000;
function claimIsStale(x){
  if(!x || !x.claimed_by || x.column === doneLane()) return false;
  const at = Date.parse(x.claimed_at || "");
  return !isNaN(at) && at < Date.now() - CLAIM_STALE_MS;
}
function claimLabel(x){
  const age = sinceLabel(x.claimed_at);
  return "claimed: "+x.claimed_by+(age ? " · "+age : "");
}
function claimTitle(x){
  return claimIsStale(x)
    ? "Claimed "+sinceLabel(x.claimed_at)+" and still not done — the session may have ended. Release it if that work isn't running."
    : "claimed by "+x.claimed_by+(x.claimed_at ? " · "+sinceLabel(x.claimed_at) : "");
}

// Releasing is always a human/agent decision, never automatic — one write,
// no side effects on lane or readiness.
function releaseClaim(kind, id){
  const arr = kind === "story" ? state.stories : state.epics;
  const x = (arr||[]).find(y => y.id === id);
  if(!x || !x.claimed_by) return;
  const who = x.claimed_by;
  x.claimed_by = null; x.claimed_at = null; x.updated_at = new Date().toISOString();
  persistResource(kind === "story" ? "stories" : "epics", arr);
  closeModal(); renderFilters(); render();
  showToast(id+" released — was held by "+who+".");
}

function renderWorkQueue(){
  const el = document.getElementById("workq");
  if(!el) return;
  if(boardArchive){ el.style.display = "none"; el.innerHTML = ""; return; }
  el.style.display = "";
  const { picks, readyButStuck } = readyQueue();
  const working = inFlight();
  const staleN = (state.stories||[]).filter(claimIsStale).length;

  // No stories anywhere: fall back to epic grain so a fresh board still
  // gets guidance from PROTOCOL §3.
  if(!state.stories.length){
    const { picks: ep, notes, wip } = nextUp();
    if(!state.epics.length){ el.style.display = "none"; el.innerHTML = ""; return; }
    el.className = "readyq empty";
    el.innerHTML = ep.length
      ? '<span class="flabel">Next up · '+ep.length+'</span>'+ep.slice(0,5).map(({e,u}) =>
          '<button class="pick" data-id="'+esc(e.id)+'" title="'+esc(e.name)+'"><span class="pid">'+esc(e.id)+
          '</span><span class="pnm">'+esc(e.name)+'</span><span class="pwhy">'+esc(e.priority)+
          (u?' · unblocks '+u:'')+'</span></button>').join("")
      : '<span class="flabel">Nothing ready</span><span class="none">'+
        (wip ? "the "+esc(COLUMNS[1])+" lane is at its WIP limit"
             : [notes.deps?notes.deps+" blocked by deps":"", notes.gate?notes.gate+" gated closed":"",
                notes.claim?notes.claim+" claimed":""].filter(Boolean).join(" · ")
               || "no epic sits in "+esc(COLUMNS[0]))+'</span>';
    el.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => goToEpic(b.dataset.id)));
    return;
  }

  if(!picks.length && !working.length){
    el.className = "readyq empty";
    el.innerHTML = '<span class="flabel">Nothing ready</span><span class="none">'+
      (readyButStuck ? readyButStuck+" ready "+(readyButStuck===1?"story is":"stories are")+
                       " claimed, in flight, or behind a gate/dep"+
                       (staleN ? " — "+staleN+" of those claims "+(staleN===1?"is":"are")+" stale, and releasing frees the work" : "")
                     : "no story has ready: true (the human's flag)")+'</span>';
    return;
  }

  el.className = "readyq";
  const head = picks.length
    ? 'Ready to pick up <span class="rq-n">'+picks.length+'</span>'+
      (working.length ? '<span class="rq-flight">· '+working.length+' in flight</span>' : '')
    : 'Agent working <span class="rq-n">'+working.length+'</span>';
  el.innerHTML = '<div class="rq-h">'+head+
      '<span class="rq-sub">'+(picks.length ? 'dependencies satisfied · criteria defined · unclaimed'
                                            : 'nothing else is ready to claim')+'</span></div>'+
    '<div class="rq-list">'+
      working.map(s => '<div class="rq-item flight'+(claimIsStale(s)?' stale':'')+'" data-eid="'+esc(s.epic_id)+'" data-sid="'+esc(s.id)+'">'+
        '<span class="rid">'+esc(s.id)+'</span><span class="rnm">'+esc(s.name)+'</span>'+
