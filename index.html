        '<span class="rq-who" title="'+esc(claimTitle(s))+'">'+(claimIsStale(s)?'⚠ ':'')+esc(s.claimed_by)+
          (sinceLabel(s.claimed_at)?' · '+esc(sinceLabel(s.claimed_at)):'')+'</span>'+
        '<button class="rq-rel" data-rel="'+esc(s.id)+'" title="Release this claim">↩</button>'+
        '</div>').join("")+
      picks.map(({s, ep}) => '<button class="rq-item" data-eid="'+esc(s.epic_id)+'" data-sid="'+esc(s.id)+'">'+
        '<span class="rid">'+esc(s.id)+'</span><span class="rnm">'+esc(s.name)+'</span>'+
        '<span class="rq-why">'+esc(ep.id+" · "+(s.kind||"feature"))+
          ((s.acceptance_criteria||[]).length ? ' · '+(s.acceptance_criteria||[]).length+' criteria' : '')+
        '</span></button>').join("")+
    '</div>';
  el.querySelectorAll(".rq-item").forEach(b => b.addEventListener("click", ev => {
    if(ev.target.closest("[data-rel]")) return;      // the release button owns its click
    renderStoryModal(b.dataset.eid, b.dataset.sid);
  }));
  el.querySelectorAll("[data-rel]").forEach(b => b.addEventListener("click", ev => {
    ev.stopPropagation(); releaseClaim("story", b.dataset.rel);
  }));
}

// Fill state + vocab + title from a /api/board payload — shared by the
// initial load() and live refresh().
function applyBoard(data){
  state = data;
  state.stories = state.stories || [];
  state.ideas = state.ideas || [];
  state.config = state.config || {};
  state.milestones = (state.milestones && !Array.isArray(state.milestones))
    ? state.milestones : { overview: null, milestones: state.milestones || [] };
  COLUMNS = state.config.lanes && state.config.lanes.length ? state.config.lanes : ["Backlog","In Progress","Review","Done"];
  PRIOS = state.config.priorities && state.config.priorities.length ? state.config.priorities : ["Now","Next","Later","Someday"];
  THEMES = state.config.themes || [];
  MILESTONES = state.config.milestones || [];
  const view = state.config.view || {};
  document.title = view.title || "agent-board";
  document.getElementById("board-title").textContent = view.title || "Board";
  state.epics.forEach(e => { if(!COLUMNS.includes(e.column)) e.column = COLUMNS[0]; });
  state.stories.forEach(s => { if(!COLUMNS.includes(s.column)) s.column = COLUMNS[0]; });
}
async function load(){
  const r = await fetch("/api/board");
  applyBoard(await r.json());
  // per-project view config: title + the filters/page applied on open.
  // An explicit hash in the URL wins over default_page so bookmarks keep working.
  const d = viewDefaults();
  filterMS = d.ms; filterTheme = d.theme; boardMode = savedBoardMode() || d.mode;
  ideaLens = savedLens() || "status";
  loadBurnerFold();
  if(!location.hash && d.page !== HOME_PAGE) location.hash = "#/" + d.page;
  renderFilters();
  render();
  renderTabs();
  wireTheme();
  wirePeek();
  route();
  wireLiveRefresh();
  wirePending();
  wirePalette();
  wireBriefing();
}

function allTags(){
  const s = new Set();
  state.epics.forEach(e => (e.tags||[]).forEach(t => s.add(t)));
  return [...s].sort();
}
// The Epics/Rows toggle is remembered per browser, keyed by project title,
// so it survives reloads without touching the shared config.json default.
function modeKey(){ return "agent-board:mode:" + (((state.config||{}).view||{}).title || "board"); }
// Back burner starts folded (it's the archive of intent, not the workspace);
// the choice is remembered per browser and project, like the mode toggle.
function burnerKey(){ return "agent-board:backburner:" + (((state.config||{}).view||{}).title || "board"); }
let backBurnerOpen = false;
function loadBurnerFold(){
  try { backBurnerOpen = localStorage.getItem(burnerKey()) === "open"; } catch(e){ backBurnerOpen = false; }
}
function toggleBurnerFold(){
  backBurnerOpen = !backBurnerOpen;
  try { localStorage.setItem(burnerKey(), backBurnerOpen ? "open" : "folded"); } catch(e){}
  renderIdeas(null);
}
function savedBoardMode(){
  try { const m = localStorage.getItem(modeKey()); return (m==="epics"||m==="rows") ? m : null; }
  catch(e){ return null; }
}
function rememberBoardMode(){
  try { localStorage.setItem(modeKey(), boardMode); } catch(e){}
}
// The saved default view, validated against current vocab (bad values -> "all").
function viewDefaults(){
  const v = state.config.view || {};
  return {
    ms:    (v.default_milestone && MILESTONES.includes(v.default_milestone)) ? v.default_milestone : "all",
    theme: (v.default_theme && THEMES.includes(v.default_theme)) ? v.default_theme : "all",
    page:  PAGES.includes(resolvePage(v.default_page)) ? resolvePage(v.default_page) : HOME_PAGE,
    mode:  v.default_board_mode === "rows" ? "rows" : "epics",
  };
}
function renderFilters(){
  const f = document.getElementById("filters");
  const tags = allTags();
  const row = (label, key, values, current, full) =>
    '<span class="flabel">'+label+'</span>'+
    '<button class="chip" data-k="'+key+'" data-v="all" aria-pressed="'+(current==="all")+'">All</button>'+
    values.map(v => '<button class="chip" data-k="'+key+'" data-v="'+esc(v)+'" aria-pressed="'+(v===current)+'" title="'+esc(v)+'">'+esc(full?v:short(v))+'</button>').join("");
  let html = '<span class="flabel">View</span>'+
    '<button class="chip mode" data-mode="epics" aria-pressed="'+(boardMode==="epics")+'" title="Kanban of epic cards">Epics</button>'+
    '<button class="chip mode" data-mode="rows" aria-pressed="'+(boardMode==="rows")+'" title="Story swimlanes, one row per epic">Rows</button>';
  // Shipped toggle appears once there's anything shipped (or while viewing it)
  const shippedN = state.epics.filter(e => e.archived_at).length;
  if(shippedN || boardArchive) html +=
    '<button class="chip" data-arch="0" aria-pressed="'+(!boardArchive)+'">Current</button>'+
    '<button class="chip" data-arch="1" aria-pressed="'+boardArchive+'" title="Closed epics — archived off the active board, still counted by milestones and deps">Shipped ('+shippedN+')</button>';
  // The header prioritises execution over taxonomy: milestone and theme
  // collapse to selects, and everything else hides until asked for. Chip
  // rows returned as many as there are vocab entries — three rows before
  // you reached the work.
  const sel = (label, key, values, current) =>
    '<label class="fsel"><span class="flabel">'+label+'</span>'+
      '<select data-fk="'+key+'"><option value="all"'+(current==="all"?" selected":"")+'>All</option>'+
      values.map(v => '<option value="'+esc(v)+'"'+(v===current?" selected":"")+'>'+esc(short(v))+'</option>').join("")+
    '</select></label>';
  if(MILESTONES.length) html += sel("Milestone","ms",MILESTONES,filterMS);
  if(THEMES.length)     html += sel("Theme","theme",THEMES,filterTheme);
  const d = viewDefaults();
  const viewDiffers = filterMS!==d.ms || filterTheme!==d.theme || boardMode!==d.mode;
  const extras = tags.length || viewDiffers;
  if(extras) html += '<button class="chip fmore" id="more-filters" aria-expanded="'+moreFilters+'">'+
    (moreFilters?"Fewer filters":"More filters")+(filterTag!=="all"?' <span class="fdot">•</span>':'')+'</button>';
  if(extras && moreFilters){
    html += '<div class="frow2">';
    if(tags.length) html += row("Tag","tag",tags,filterTag,true);
    if(viewDiffers) html += '<button class="chip savev" id="save-view" title="Save the current filters as this project\'s default view (writes config.json)">★ set as default view</button>';
    html += '</div>';
  }
  f.innerHTML = html;
  f.querySelectorAll("select[data-fk]").forEach(s => s.addEventListener("change", () => {
    if(s.dataset.fk==="ms") filterMS = s.value; else filterTheme = s.value;
    renderFilters(); render();
  }));
  const mf = document.getElementById("more-filters");
  if(mf) mf.addEventListener("click", () => { moreFilters = !moreFilters; renderFilters(); });
  f.querySelectorAll(".chip[data-k]").forEach(c => c.addEventListener("click", () => {
    const v = c.dataset.v;
    if(c.dataset.k==="ms") filterMS = v;
    else if(c.dataset.k==="theme") filterTheme = v;
    else filterTag = v;
    renderFilters(); render();
  }));
  f.querySelectorAll(".chip.mode").forEach(c => c.addEventListener("click", () => {
    if(boardMode === c.dataset.mode) return;
    boardMode = c.dataset.mode;
    rememberBoardMode();
    renderFilters(); render();
  }));
  f.querySelectorAll(".chip[data-arch]").forEach(c => c.addEventListener("click", () => {
    boardArchive = c.dataset.arch === "1";
    renderFilters(); render();
  }));
  const sv = document.getElementById("save-view");
  if(sv) sv.addEventListener("click", () => {
    state.config.view = Object.assign({}, state.config.view, {
      title: (state.config.view||{}).title || document.getElementById("board-title").textContent,
      default_page: currentRoute().page,
      default_milestone: filterMS,
      default_theme: filterTheme,
      default_board_mode: boardMode,
    });
    persistResource("config", state.config);
    showToast("Default view saved — this is what loads on open now.");
    renderFilters();
  });
}
function epicShown(e){
  if(!!e.archived_at !== boardArchive) return false;   // Current vs Shipped, before everything
  if(filterMS!=="all" && e.milestone!==filterMS) return false;
  if(filterTheme!=="all" && e.theme!==filterTheme) return false;
  if(filterTag!=="all" && !(e.tags||[]).includes(filterTag)) return false;
  return true;
}

function render(){
  const exec = document.getElementById("exec");
  exec.innerHTML = "";
  exec.classList.toggle("rows", boardMode==="rows");
  exec.style.setProperty("--lanes", COLUMNS.length);
  const shown = state.epics.filter(epicShown);
  const filtered = filterMS!=="all" || filterTheme!=="all" || filterTag!=="all";
  if(boardMode==="rows"){
    renderSwimlanes(exec, shown);
    const rowStories = shown.flatMap(e => storiesOf(e.id));
    const sdone = rowStories.filter(s => s.column===doneLane()).length;
    const viewStoryN = state.epics.filter(e => !!e.archived_at === boardArchive)
      .flatMap(e => storiesOf(e.id)).length;
    document.getElementById("counts").textContent =
      filtered ? (rowStories.length + " of " + viewStoryN + " stories shown")
               : (rowStories.length + (rowStories.length===1?" story":" stories") + " · " + sdone + " done"
                  + (boardArchive ? " · shipped" : ""));
  } else {
    COLUMNS.forEach(col => {
      const items = shown.filter(e => e.column === col);
      const sec = document.createElement("section");
      sec.className = "col";
      sec.dataset.col = col;
      sec.style.setProperty("--lc", laneVar(col));
      // WIP-limited lanes show board-wide total/limit — the number
      // wipBlocked() compares — and go loud when over. Advise-only:
      // limits never block a drop (that stays the agent protocol's job).
      // The Shipped view shows plain counts: limits are a property of
      // live work, and archived epics never count toward them.
      const limit = boardArchive ? null : (state.config.wip_limits||{})[col];
      const laneTotal = state.epics.filter(e => !e.archived_at && e.column === col).length;
      const ctHtml = limit != null
        ? '<span class="ct wlim'+(laneTotal>limit?' over':'')+'" title="WIP limit '+limit+
          (laneTotal>limit?' — over by '+(laneTotal-limit):'')+' · '+laneTotal+' in lane, board-wide">'+laneTotal+'/'+limit+'</span>'
        : '<span class="ct">'+items.length+'</span>';
      sec.innerHTML =
        '<div class="col-h"><span class="sw"></span>'+
          '<span class="nm">'+esc(col)+'</span>'+ctHtml+'</div>'+
        '<div class="col-body"></div>';
      const body = sec.querySelector(".col-body");
      const add = document.createElement("button");
      add.className = "addcard"; add.type = "button"; add.textContent = "+ add card";
      add.addEventListener("click", () => openCreate(col));
      body.appendChild(add);
      items.forEach(e => body.appendChild(cardEl(e)));
      wireDrop(sec);
      exec.appendChild(sec);
    });
    const viewEpics = state.epics.filter(e => !!e.archived_at === boardArchive);
    const total = viewEpics.length, done = viewEpics.filter(e=>e.column===doneLane()).length;
    document.getElementById("counts").textContent = boardArchive
      ? (filtered ? (shown.length + " of " + total + " shipped shown") : (total + " shipped"))
      : (filtered ? (shown.length + " of " + total + " shown")
                  : (total + " cards · " + done + " done"));
  }
  document.getElementById("stories-note").innerHTML = state.stories.length
    ? "<b>"+state.stories.length+"</b> stories" : "";
  updateFooter(currentRoute().page);
  renderWorkQueue();
}

function cardEl(e){
  const el = document.createElement("article");
  const epicNeeds = needsBit(e);
  el.className = "card" + (epicNeeds ? " needs-you" : (epicUnblocked(e) ? " unblocked" : ""));
  el.tabIndex = 0; el.draggable = !boardArchive; el.dataset.id = e.id;
  const depBits = (e.deps||[]).length
    ? '<span class="dep">⊸'+depChips(e.deps)+'</span>'
    : "";
  const readyTag = epicUnblocked(e)
    ? '<span class="rdytag" title="Every dependency is done and nothing else blocks this — it can be started now">▶ ready to start</span>'
    : "";
  const claimBit = e.claimed_by
    ? '<span class="claim'+(claimIsStale(e)?' stale':'')+'" title="'+esc(claimTitle(e))+'">'+
      esc(claimLabel(e))+(claimIsStale(e)?' ⚠':'')+'</span>' : "";
  // Same badge as the rows-mode row header — one gate vocabulary across
  // modes. Advises only; checkMove never reads gates.
  const gateBit = !gateOpen(e)
    ? '<span class="egate" title="Closed until a human adds this gate to open_gates in config.json">⛔ '+esc(e.gate)+'</span>'
    : "";
  const st = storiesOf(e.id);
  // "ready" means still buildable — a story in the done lane is finished,
  // not ready (the ready-queue strip's rule, applied to the badge).
  const rdyN = st.filter(s => s.ready && s.column !== doneLane()).length;
  const storyBit = st.length
    ? '<span class="stbadge">'+st.length+(st.length===1?" story":" stories")+
      (rdyN ? ' · <span class="rdy">'+rdyN+' ready</span>' : "")+'</span>'
    : "";
  el.innerHTML =
    '<div class="top"><span class="id">'+esc(e.id)+'</span><span class="prio '+prioClass(e.priority)+'">'+esc(e.priority)+'</span></div>'+
    '<p class="title">'+esc(e.name)+'</p>'+
    '<div class="meta">'+
      (e.milestone?'<span class="tagpill" title="'+esc(e.milestone)+'">'+esc(short(e.milestone))+'</span>':"")+
      (e.theme?'<span class="tagpill" title="'+esc(e.theme)+'">'+esc(short(e.theme))+'</span>':"")+
      (e.tags||[]).map(t=>'<span class="tagpill">'+esc(t)+'</span>').join("")+
      (e.systems||[]).map(s=>'<span class="tagpill sys" title="system involved">'+esc(s)+'</span>').join("")+
      (e.status?'<span class="st">'+esc(e.status)+'</span>':"")+storyBit+depBits+gateBit+claimBit+
      (epicNeeds ? '<span class="sstate warn" title="'+esc(epicNeeds.title)+'">'+esc(epicNeeds.label)+'</span>'
        : needsGrooming(e) ? '<span class="sstate warn" title="Committed but not broken down yet — groom it into stories with acceptance criteria">⚠ needs grooming</span>'
        : readyTag)+
      '</div>'+needsLine(e);
  el.addEventListener("dragstart", ev => {
    ev.dataTransfer.setData("text/plain", e.id);
    ev.dataTransfer.effectAllowed = "move";
    el.classList.add("dragging"); document.body.classList.add("is-dragging");
    document.querySelectorAll(".col").forEach(sec => { if(!checkMove(e, sec.dataset.col).ok) sec.classList.add("no-drop"); });
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging"); document.body.classList.remove("is-dragging");
    document.querySelectorAll(".col").forEach(c=>c.classList.remove("drop-hover","no-drop"));
  });
  el.addEventListener("click", () => openEdit(e.id));
  el.addEventListener("keydown", ev => { if(ev.key==="Enter"){ev.preventDefault();openEdit(e.id);} });
  return el;
}

function wireDrop(sec){
  sec.addEventListener("dragover", ev => {
    ev.preventDefault();
    if(sec.classList.contains("no-drop")){ ev.dataTransfer.dropEffect="none"; return; }
    ev.dataTransfer.dropEffect="move"; sec.classList.add("drop-hover");
  });
  sec.addEventListener("dragleave", ev => { if(!sec.contains(ev.relatedTarget)) sec.classList.remove("drop-hover"); });
  sec.addEventListener("drop", ev => {
    ev.preventDefault(); sec.classList.remove("drop-hover");
    const id = ev.dataTransfer.getData("text/plain");
    const ep = byId()[id];
    if(!ep || ep.column === sec.dataset.col) return;
    const chk = checkMove(ep, sec.dataset.col);
    if(!chk.ok){ showToast(chk.reason); return; }
    ep.column = sec.dataset.col; ep.updated_at = new Date().toISOString();
    render(); persist();
  });
}

/* ---- rows mode: story swimlanes by epic ---- */
function renderSwimlanes(exec, shown){
  const withStories = shown.filter(e => storiesOf(e.id).length);
  const head = document.createElement("div");
  head.className = "rows-head";
  head.innerHTML = COLUMNS.map(col => {
    // Rows mode counts stories — the unit agents actually claim — against
    // the same lane limit; the title names the grain so the two modes
    // can't be misread as disagreeing.
    const n = withStories.reduce((a,e) => a + storiesOf(e.id).filter(s => s.column===col).length, 0);
    const limit = (state.config.wip_limits||{})[col];
    const ct = limit != null
      ? '<span class="ct wlim'+(n>limit?' over':'')+'" title="WIP limit '+limit+' · '+n+
        ' stories in this lane'+(n>limit?' — over by '+(n-limit):'')+'">'+n+'/'+limit+'</span>'
      : '<span class="ct">'+n+'</span>';
    return '<div class="rh" style="--lc:'+laneVar(col)+'"><span class="sw"></span>'+
      '<span class="nm">'+esc(col)+'</span>'+ct+'</div>';
  }).join("");
  exec.appendChild(head);
  withStories.forEach(e => exec.appendChild(swimEl(e)));
  exec.querySelectorAll("[data-arch-epic]").forEach(b =>
    b.addEventListener("click", ev => { ev.stopPropagation(); toggleArchiveEpic(b.dataset.archEpic); }));
  const without = shown.length - withStories.length;
  const note = document.createElement("div");
  note.className = "rows-note";
  note.textContent = withStories.length
    ? (without ? without + (without===1 ? " epic" : " epics") + " without stories — shown in Epics mode" : "")
    : (shown.length ? "No stories yet — open an epic in Epics mode to add them."
                    : "No epics to show — switch to Epics mode to add cards.");
  if(note.textContent) exec.appendChild(note);
}

function swimEl(e){
  const el = document.createElement("section");
  const st = storiesOf(e.id);
  const done = st.filter(s => s.column === doneLane()).length;
  // The stories are the truth: an epic whose every story is done is
  // finished, wherever its own card happens to sit. Requiring the card to
  // reach the done lane too made the human maintain bookkeeping the row
  // already knew — rows stayed open at 3/3 because nobody dragged the epic.
  const finished = st.length > 0 && !e.archived_at && canRemove(e);
  const folded = finished && !expandedRows.has(e.id);
  el.className = "swim" + (epicUnblocked(e) ? " unblocked" : "") + (folded ? " done-fold" : "");
  el.dataset.id = e.id;
  const gated = !gateOpen(e);
  const h = document.createElement("div");
  h.className = "swim-h"; h.title = folded ? "Finished — click to expand" : "Edit "+e.id;
  // A finished-but-unarchived epic is one line plus the action that clears
  // it off the board — the archive lives in the modal, which rows mode
  // can't reach, so it comes to the row instead.
  h.innerHTML = folded
    ? '<span class="eid">'+esc(e.id)+'</span><span class="en">'+esc(e.name)+'</span>'+
      '<span class="edone">✓ '+done+'/'+st.length+'</span>'+
      '<button class="chip rowarch" data-arch-epic="'+esc(e.id)+'" title="'+esc(removeTitle(e))+'">⌂ Remove from board</button>'
    : '<span class="eid">'+esc(e.id)+'</span><span class="en">'+esc(e.name)+'</span>'+
      (gated ? '<span class="egate" title="Closed until a human adds this gate to open_gates in config.json">⛔ '+esc(e.gate)+'</span>' : "")+
      epicRollup(e, st);
  h.addEventListener("click", ev => {
    if(ev.target.closest("[data-arch-epic]")) return;      // the button owns its click
    if(finished){ expandedRows.has(e.id) ? expandedRows.delete(e.id) : expandedRows.add(e.id); render(); return; }
    openEdit(e.id);
  });
  el.appendChild(h);
  if(!folded){
    const b = document.createElement("div");
    b.className = "swim-b";
    COLUMNS.forEach(col => {
      const cell = document.createElement("div");
      cell.className = "cell"; cell.dataset.col = col; cell.dataset.epic = e.id;
      cell.style.setProperty("--lc", laneVar(col));
      const inCol = st.filter(s => s.column === col);
      // Finished stories inside a still-active epic collapse to a count:
      // the remaining work should own the row's attention.
      if(col === doneLane() && inCol.length && !expandedDone.has(e.id) && done !== st.length){
        const sum = document.createElement("button");
        sum.className = "donefold"; sum.type = "button";
        sum.textContent = "✓ "+inCol.length+" done · view";
        sum.addEventListener("click", ev => { ev.stopPropagation(); expandedDone.add(e.id); render(); });
        cell.appendChild(sum);
      } else {
        inCol.forEach(s => cell.appendChild(storyCardEl(s)));
      }
      wireStoryDrop(cell);
      b.appendChild(cell);
    });
    el.appendChild(b);
  }
  return el;
}

function storyCardEl(s){
  const el = document.createElement("article");
  el.className = "scard" + (needsBit(s) ? " needs-you" : "");
  el.tabIndex = 0; el.draggable = true; el.dataset.sid = s.id;
  el.innerHTML =
    '<div class="srow"><span class="sk">'+esc(s.kind||"feature")+'</span>'+
      '<span class="sid">'+esc(s.id)+'</span>'+
      stateChip(s)+'</div>'+
    '<div class="snm">'+esc(s.name)+'</div>'+
    needsLine(s);
  el.addEventListener("dragstart", ev => {
    ev.dataTransfer.setData("text/plain", "story:"+s.id);
    ev.dataTransfer.effectAllowed = "move";
    el.classList.add("dragging"); document.body.classList.add("is-dragging");
    document.querySelectorAll(".swim .cell").forEach(c => {
      const ep = byId()[c.dataset.epic];
      if(c.dataset.epic !== s.epic_id || (ep && !gateOpen(ep))) c.classList.add("no-drop");
    });
  });
  el.addEventListener("dragend", () => {
    el.classList.remove("dragging"); document.body.classList.remove("is-dragging");
    document.querySelectorAll(".swim .cell").forEach(c => c.classList.remove("drop-hover","no-drop"));
  });
  const openStory = () => { document.getElementById("scrim").classList.add("on"); renderStoryModal(s.epic_id, s.id); };
  el.addEventListener("click", openStory);
  el.addEventListener("keydown", ev => { if(ev.key==="Enter"){ ev.preventDefault(); openStory(); } });
  return el;
}

function wireStoryDrop(cell){
  cell.addEventListener("dragover", ev => {
    ev.preventDefault();
    if(cell.classList.contains("no-drop")){ ev.dataTransfer.dropEffect = "none"; return; }
    ev.dataTransfer.dropEffect = "move"; cell.classList.add("drop-hover");
  });
  cell.addEventListener("dragleave", ev => { if(!cell.contains(ev.relatedTarget)) cell.classList.remove("drop-hover"); });
  cell.addEventListener("drop", ev => {
    ev.preventDefault(); cell.classList.remove("drop-hover");
    const data = ev.dataTransfer.getData("text/plain");
    if(!data.startsWith("story:")) return;
    const s = state.stories.find(x => x.id === data.slice(6));
    if(!s) return;
    if(s.epic_id !== cell.dataset.epic){ showToast(s.id+" belongs to "+s.epic_id+" — stories move within their epic's row."); return; }
    const ep = byId()[s.epic_id];
    if(ep && !gateOpen(ep)){ showToast(ep.id+" is gated ("+ep.gate+") — a human opens gates in config.json."); return; }
    if(s.column === cell.dataset.col) return;
    s.column = cell.dataset.col; s.updated_at = new Date().toISOString();
    render(); persistResource("stories", state.stories);
  });
}

/* ---- modal (edit + create + delete) ---- */
function blankEpic(col){
  return { id: suggestId(), name:"", description:"", notes:"",
    theme:(filterTheme!=="all"?filterTheme:""), milestone:(filterMS!=="all"?filterMS:""),
    priority:PRIOS[0], status:"", gate:"none", test_plan:"",
    systems:[], context_docs:[],
    tags:[], deps:[], column:col||COLUMNS[0], claimed_by:null, claimed_at:null, updated_at:null };
}
function suggestId(){ const ids=new Set(state.epics.map(e=>e.id)); let n=1; while(ids.has("NEW"+n)) n++; return "NEW"+n; }
function openEdit(id){ const e = byId()[id]; if(!e) return; modalMode="edit"; editingId=id; renderModal(e); }
function openCreate(col){ modalMode="create"; editingId=null; renderModal(blankEpic(col)); }

function renderModal(e){
  const create = modalMode==="create";
  const est = create ? [] : storiesOf(e.id);
  const eDone = est.filter(x => x.column === doneLane()).length;
  const eFocus = laneFocus(e);
  const eClaimBlock =
    '<div class="rgroup"><span class="rlab">'+(eFocus.key==="review" ? "Built by" : "Claim")+'</span>'+
      '<div class="rfact">'+claimFact(e)+'</div>'+
      '<div class="field mono"><input id="f-claim" value="'+esc(e.claimed_by||"")+'" placeholder="agent/session id" aria-label="Claimed by"></div>'+
      '<input type="hidden" id="f-claimed-at" value="'+esc(e.claimed_at||"")+'">'+
    '</div>';
  const modal = document.getElementById("modal");
  modal.className = "modal wide";
  modal.style.setProperty("--lc", laneVar(e.column));
  modal.innerHTML =
    modalHead({ id:e.id, nameId:"f-name", name:e.name, placeholder:"What is this card?",
      where: (create ? "New card" : (est.length ? eDone+"/"+est.length+" stories done" : "no stories yet"))+
             ' · <b>'+esc(e.column)+'</b>',
      ask: create ? "" : eFocus.ask })+
    '<div class="mgrid">'+
      '<div class="mcol">'+
        '<div class="field"><label for="f-desc">Description</label><textarea id="f-desc" placeholder="What is this, and what does it change?">'+esc(e.description)+'</textarea></div>'+
        '<div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" placeholder="Provenance, workflow impact, decisions taken">'+esc(e.notes||"")+'</textarea></div>'+
        '<div class="field"><label for="f-testplan">Test plan '+
            '<span class="ct">· how this change gets validated</span></label>'+
          '<textarea id="f-testplan" placeholder="What would you run or look at to prove this works? Carried from the idea\u2019s validation plan on promotion.">'+esc(e.test_plan||"")+'</textarea></div>'+
        (create ? "" : storiesSection(e.id))+
        (!create && (e.context_docs||[]).length
          ? '<div class="field" id="m-ctxdocs"><label>Context docs <span class="ct">· read-only, click to copy the path</span></label>'+ctxDocs(e.context_docs)+'</div>'
          : "")+
      '</div>'+
      '<div class="mrail">'+
        (eFocus.key==="flight" || eFocus.key==="review" ? eClaimBlock : "")+
        '<div class="rgroup">'+
          '<div class="field row2" style="margin-top:0">'+
            '<div><label class="rlab" for="f-lane">Lane</label><select id="f-lane">'+opts(COLUMNS,e.column)+'</select></div>'+

/* ---- stories (nested in the epic modal) ---- */
const KINDS = ["feature","test","integration","chore","docs"];
/* ---- peek: what a card says when you dwell on it ----
   The board is a scanning surface; opening a card to answer "what is this
   again?" costs a modal and a click back. A second of dwell is the signal
   that you meant this card, and the peek answers with the things the card
   had no room for — the prose, the criteria, who has it. Read-only: it never
   takes the pointer (pointer-events:none), so it cannot get in the way of a
   drag or a click. */
const PEEK_DELAY = 1000;
let peekTimer = null, peekEl = null, peekFor = null, peekKey = null;
// Cards are replaced wholesale on every re-render, and a live board re-renders
// while you are still dwelling. Track the card's *identity*, not its node, and
// re-find it when the timer fires — otherwise an agent moving an unrelated
// card two rows away silently cancels your peek.
function cardKey(el){
  return el.classList.contains("scard") ? "scard:"+el.dataset.sid
       : el.classList.contains("card")  ? "card:"+el.dataset.id
       : el.classList.contains("idea")  ? "idea:"+el.dataset.id : null;
}
function cardByKey(key){
  if(!key) return null;
  const [kind, id] = [key.slice(0, key.indexOf(":")), key.slice(key.indexOf(":")+1)];
  const attr = kind === "scard" ? "sid" : "id";
  return document.querySelector("."+kind+"[data-"+attr+'="'+(window.CSS && CSS.escape ? CSS.escape(id) : id)+'"]');
}

function peekBox(){
  if(!peekEl){
    peekEl = document.createElement("div");
    peekEl.className = "peek";
    peekEl.setAttribute("role", "tooltip");
    peekEl.hidden = true;
    document.body.appendChild(peekEl);
  }
  return peekEl;
}
function hidePeek(){
  clearTimeout(peekTimer); peekTimer = null; peekFor = null; peekKey = null;
  if(peekEl){ peekEl.classList.remove("on"); peekEl.hidden = true; }
}
// Clamp into the viewport rather than letting the box run off an edge: the
// card can be anywhere, including the last row of a scrolled board.
function placePeek(box, anchor){
  const r = anchor.getBoundingClientRect();
  box.hidden = false;
  const b = box.getBoundingClientRect();
  const gap = 10;
  let x = r.right + gap;
  if(x + b.width > innerWidth - 8) x = r.left - b.width - gap;      // flip to the left
  if(x < 8) x = Math.max(8, Math.min(r.left, innerWidth - b.width - 8));
  let y = r.top;
  if(y + b.height > innerHeight - 8) y = innerHeight - b.height - 8;
  box.style.left = Math.round(x)+"px";
  box.style.top  = Math.round(Math.max(8, y))+"px";
}
const pkP = (label, val) => val ? '<p><b style="color:var(--ink-3)">'+esc(label)+':</b> '+esc(val)+'</p>' : "";
const pkClamp = (t, n) => { t = (t||"").trim(); return t.length > n ? t.slice(0, n).replace(/\s+\S*$/, "")+"…" : t; };
function pkList(items, n, label){
  if(!items || !items.length) return "";
  return '<div class="pksec">'+esc(label)+' · '+items.length+'</div><ul>'+
    items.slice(0, n).map(c => '<li>'+esc(pkClamp(c, 150))+'</li>').join("")+'</ul>'+
    (items.length > n ? '<div class="pkmore">+'+(items.length-n)+' more</div>' : "");
}

function peekStory(s){
  const ep = byId()[s.epic_id];
  const foot = [ s.kind && esc(s.kind), s.priority && esc(s.priority),
                 s.claimed_by ? "claimed by "+esc(s.claimed_by) : "unclaimed",
                 s.ready ? "✓ ready" : "not ready" ].filter(Boolean);
  return { colour: laneVar(s.column),
    html: '<div class="pkhead"><span class="pkid">'+esc(s.id)+'</span>'+stateChip(s)+'</div>'+
      '<h4>'+esc(s.name)+'</h4>'+
      '<div class="pkwhere">'+(ep ? esc(ep.id)+" · "+esc(ep.name)+" · " : "")+esc(s.column)+'</div>'+
      (s.description ? '<p style="margin-top:9px">'+esc(pkClamp(s.description, 320))+'</p>' : "")+
      pkList(s.acceptance_criteria, 4, "Acceptance criteria")+
      (s.context ? '<div class="pksec">Context</div><p>'+esc(pkClamp(s.context, 200))+'</p>' : "")+
      '<div class="pkfoot">'+foot.join(" · ")+'</div>' };
}
function peekEpic(e){
  const st = storiesOf(e.id), done = st.filter(x => x.column === doneLane()).length;
  const foot = [ st.length ? done+"/"+st.length+" stories done" : "no stories yet",
                 esc(e.priority), e.milestone && esc(short(e.milestone)), e.theme && esc(short(e.theme)),
                 e.claimed_by ? "claimed by "+esc(e.claimed_by) : null ].filter(Boolean);
  return { colour: laneVar(e.column),
    html: '<div class="pkhead"><span class="pkid">'+esc(e.id)+'</span>'+
        (needsGrooming(e) ? '<span class="sstate warn">⚠ needs grooming</span>' : "")+
        '<span class="pkwhere" style="margin-left:auto">'+esc(e.column)+'</span></div>'+
      '<h4>'+esc(e.name)+'</h4>'+
      (e.description ? '<p style="margin-top:9px">'+esc(pkClamp(e.description, 320))+'</p>' : "")+
      (e.test_plan ? '<div class="pksec">Test plan</div><p>'+esc(pkClamp(e.test_plan, 200))+'</p>' : "")+
      pkList(st.map(x => x.name), 5, "Stories")+
      (gateOpen(e) ? "" : '<p style="color:var(--lane-2);margin-top:8px">⛔ gated: '+esc(e.gate)+'</p>')+
      ((e.deps||[]).length ? '<div class="pksec">Depends on</div><div>'+depChips(e.deps)+'</div>' : "")+
      '<div class="pkfoot">'+foot.join(" · ")+'</div>' };
}
function peekIdea(i){
  const st = ideaCardState(i), opens = unlockedBy(i.id);
  const foot = [ esc(ideaStatus(i)), esc(i.priority),
                 (i.effort||i.impact) ? esc((i.effort||"—")+" effort · "+(i.impact||"—")+" impact") : null,
                 i.theme && esc(short(i.theme)) ].filter(Boolean);
  return { colour: "var(--st-"+({idle:"idle",front:"active",review:"decide",ready:"ready",done:"ready",rejected:"problem"}[st.key]||"active")+")",
    html: '<div class="pkhead"><span class="pkid">'+esc(i.id)+'</span>'+
        '<span class="spill '+st.key+'">'+esc(st.label)+'</span></div>'+
      '<h4>'+esc(i.title)+'</h4>'+
      (i.description ? '<p style="margin-top:9px">'+esc(pkClamp(i.description, 320))+'</p>' : "")+
      pkP("Why now", pkClamp(i.why_now, 180))+
      pkP("Decision needed", pkClamp(i.decision, 180))+
      pkP("Validation plan", pkClamp(i.validation, 180))+
      (opens.length ? '<div class="pksec">Opens · '+opens.length+'</div><ul>'+
        opens.slice(0,4).map(u => '<li>'+esc(short(u.title))+'</li>').join("")+'</ul>' : "")+
      '<div class="pkfoot">'+foot.join(" · ")+'</div>' };
}

function peekFor_(el){
  if(el.classList.contains("scard")) { const s = state.stories.find(x => x.id === el.dataset.sid); return s && peekStory(s); }
  if(el.classList.contains("card"))  { const e = byId()[el.dataset.id];                            return e && peekEpic(e); }
  if(el.classList.contains("idea"))  { const i = ideaById(el.dataset.id);                          return i && peekIdea(i); }
  return null;
}
function showPeek(el){
  const data = peekFor_(el); if(!data) return;
  const box = peekBox();
  box.style.setProperty("--pc", data.colour);
  box.innerHTML = data.html;
  placePeek(box, el);
  // Reflow, then reveal — a rAF here never runs while the tab is throttled or
  // occluded, which would leave the box positioned but permanently invisible.
  void box.offsetWidth;
  box.classList.add("on");
}
// One delegated listener per surface rather than a handler per card: cards
// are re-rendered constantly (live refresh, every filter change) and
// per-card listeners would have to be re-attached each time.
function wirePeek(){
  const armed = ev => {
    const el = ev.target.closest(".scard, .card, .idea");
    if(!el) return;
    const key = cardKey(el);
    if(!key || key === peekKey) return;         // same card, re-rendered or not
    hidePeek();
    peekFor = el; peekKey = key;
    peekTimer = setTimeout(() => {
      const live = cardByKey(key);              // survive a re-render mid-dwell
      if(peekKey === key && live) showPeek(live);
    }, PEEK_DELAY);
  };
  document.addEventListener("mouseover", armed);
  document.addEventListener("mouseout", ev => {
    if(peekFor && !ev.relatedTarget?.closest?.(".scard, .card, .idea")) hidePeek();
  });
  // Anything that means "I have moved on" kills it, dwell timer included.
  ["mousedown","dragstart","wheel","keydown"].forEach(e =>
    document.addEventListener(e, hidePeek, true));
  window.addEventListener("scroll", hidePeek, true);
  document.addEventListener("scroll", hidePeek, true);
}

/* ---- colour theme ----
   Unset follows the OS (the prefers-color-scheme blocks); one click pins a
   choice for good. The preference is per person, not per project, so unlike
   the lens and the board mode its key carries no board title. */
const THEME_KEY = "agent-board:theme";
function currentTheme(){
  const set = document.documentElement.getAttribute("data-theme");
  if(set === "light" || set === "dark") return set;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function paintThemeButton(){
  const b = document.getElementById("theme-t"); if(!b) return;
  const dark = currentTheme() === "dark";
  // The glyph shows what you would switch *to* — a button says what it does.
  b.textContent = dark ? "☀" : "☾";
  b.title = dark ? "Switch to light" : "Switch to dark";
}
function toggleTheme(){
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem(THEME_KEY, next); }catch(e){}
  paintThemeButton();
}
function wireTheme(){
  const b = document.getElementById("theme-t"); if(!b) return;
  b.addEventListener("click", toggleTheme);
  paintThemeButton();
  // Still following the OS? Then keep following it when the OS flips.
  if(window.matchMedia){
    const mq = matchMedia("(prefers-color-scheme: dark)");
    const onFlip = () => { if(!document.documentElement.getAttribute("data-theme")) paintThemeButton(); };
    mq.addEventListener ? mq.addEventListener("change", onFlip) : mq.addListener(onFlip);
  }
}

/* ---- wide modal chrome ----
   Shared by the epic and story modals so the board speaks one card
   vocabulary: a sticky header carrying the id, the computed state chip and
   where the card sits, then the name as an editable title. */
// Textareas size themselves to their content. A fixed min-height meant the
// acceptance criteria — the reason you opened the card — scrolled inside a
// box inside a scrolling modal.
function autoGrow(ta){
  ta.style.height = "auto";
  ta.style.height = Math.max(ta.scrollHeight, 36) + "px";
}
function wireAutoGrow(root){
  const grow = () => root.querySelectorAll("textarea").forEach(autoGrow);
  root.querySelectorAll("textarea").forEach(ta => ta.addEventListener("input", () => autoGrow(ta)));
  grow();
  requestAnimationFrame(grow);   // again once laid out: scrollHeight is 0 while hidden
}
// `where` and `chip` are pre-built HTML; everything else is escaped here.
function modalHead(o){
  return '<div class="mhead"><div class="mh-top">'+
      '<span class="id">'+esc(o.id)+'</span>'+(o.chip || "")+
      (o.where ? '<span class="mh-where">'+o.where+'</span>' : "")+
    '</div>'+
    '<input class="mh-name" id="'+o.nameId+'" value="'+esc(o.name||"")+'" '+
      'placeholder="'+esc(o.placeholder||"Name")+'" aria-label="Name">'+
    (o.ask ? '<span class="mh-ask">This lane asks: <b>'+esc(o.ask)+'</b></span>' : "")+
    '</div>';
}
// One claim reading for the rail — the same facts the card shows, spelled out.
function claimFact(x){
  if(!x.claimed_by) return '<span class="dim">unclaimed</span>';
  const since = sinceLabel(x.claimed_at);
  return '<b>'+esc(x.claimed_by)+'</b>'+(since ? ' <span class="dim">· '+esc(since)+'</span>' : "")+
         (claimIsStale(x) ? ' <span style="color:var(--lane-2)">⚠ stale</span>' : "");
}

function storiesSection(epicId){
  const st = storiesOf(epicId);
  return '<div class="field"><label>Stories ('+st.length+')</label><div id="m-stories">'+
    st.map(s =>
      '<div class="story-row" data-sid="'+esc(s.id)+'">'+
        '<span class="sk">'+esc(s.kind||"feature")+'</span>'+
        '<span class="sn" title="click to edit">'+esc(s.name)+'</span>'+
        '<span class="slane">'+esc(s.column||"")+'</span>'+
        stateChip(s)+
        '<label class="rdy-t" title="Definition of ready: enough context for an agent to build this">'+
          '<input type="checkbox" '+(s.ready?"checked":"")+'> ready</label>'+
      '</div>').join("")+
    '</div><button type="button" class="addstory" id="s-add">+ add story</button></div>';
}
function wireStoriesSection(epicId){
  const wrap = document.getElementById("m-stories");
  if(!wrap) return;
  wrap.querySelectorAll(".story-row").forEach(row => {
    const sid = row.dataset.sid;
    row.querySelector(".sn").addEventListener("click", () => renderStoryModal(epicId, sid));
    row.querySelector("input[type=checkbox]").addEventListener("change", ev => {
      const s = state.stories.find(x=>x.id===sid); if(!s) return;
      s.ready = ev.target.checked; s.updated_at = new Date().toISOString();
      persistResource("stories", state.stories); render();
    });
  });
  document.getElementById("s-add").addEventListener("click", () => renderStoryModal(epicId, null));
}
function suggestStoryId(epicId){
  const ids = new Set(state.stories.map(s=>s.id));
  let n = 1; while(ids.has(epicId+"-"+n)) n++;
  return epicId+"-"+n;
}
function renderStoryModal(epicId, sid){
  const create = !sid;
  const s = create
    ? { id: suggestStoryId(epicId), epic_id: epicId, name:"", description:"", kind:"feature",
        acceptance_criteria:[], context:"", systems:[], ready:false, column:COLUMNS[0], priority:PRIOS[0],
        claimed_by:null, claimed_at:null, updated_at:null }
    : state.stories.find(x=>x.id===sid);
  if(!s) return;
  const ep = byId()[epicId];
  const acN = (s.acceptance_criteria||[]).length;
  const epStories = ep ? storiesOf(ep.id) : [];
  const epDone = epStories.filter(x => x.column === doneLane()).length;
  const unmetDeps = ep ? depsOf(ep).filter(d => d.column !== doneLane()).map(d=>d.id) : [];
  const siblings = ep ? epStories.filter(x => x.id !== s.id && x.column !== doneLane()).map(x=>x.id) : [];
  const focus = laneFocus(s);

  // The three content blocks, ordered by what the lane is asking. In review
  // and done the criteria are the point — they are the checklist and the
  // record — so they lead; while queued or in flight the description does.
  const bDesc =
    '<div class="field"><label for="s-desc">Description</label>'+
      '<textarea id="s-desc" placeholder="What is being built, and why this shape?">'+esc(s.description||"")+'</textarea></div>';
  const acLabel = (focus.key==="review" ? "Check these" : focus.key==="done" ? "What this delivered" : "Acceptance criteria")+
    ' <span class="ct">· '+(acN ? acN : "none yet")+'</span>';
  const acEditor =
    '<label for="s-ac">'+acLabel+' <span class="ct">· one per line</span></label>'+
    '<textarea id="s-ac" placeholder="What must be true for this story to be done?&#10;One per line.">'+esc((s.acceptance_criteria||[]).join("\n"))+'</textarea>';
  const bAc = '<div class="field" id="s-ac-field">'+
    (acN
      ? '<label>'+acLabel+'<button type="button" class="eb" id="s-ac-edit">edit</button></label>'+
        '<ul class="aclist">'+(s.acceptance_criteria||[]).map(c => '<li>'+esc(c)+'</li>').join("")+'</ul>'
      : acEditor)+
    '</div>';
  const bCtx =
    '<div class="field"><label for="s-ctx">Context for the builder</label>'+
      '<textarea id="s-ctx" placeholder="Repos, paths, docs to read before starting">'+esc(s.context||"")+'</textarea></div>';

  // Rail blocks, likewise ordered: what stops a start when queued, who holds
  // it once it is moving, what is still outstanding once it is done.
  const rSettings =
    '<div class="rgroup">'+
      '<div class="field row2" style="margin-top:0">'+
        '<div><label class="rlab" for="s-kind">Kind</label><select id="s-kind">'+opts(KINDS,s.kind||"feature")+'</select></div>'+
        '<div><label class="rlab" for="s-prio">Priority</label><select id="s-prio">'+opts(PRIOS,s.priority)+'</select></div>'+
      '</div>'+
      '<div class="field"><label class="rlab" for="s-lane">Lane</label><select id="s-lane">'+opts(COLUMNS,s.column)+'</select></div>'+
      '<div class="field"><label class="rdy-t" title="Definition of ready: enough context for an agent to build this">'+
        '<input type="checkbox" id="s-ready" '+(s.ready?"checked":"")+'> ready — enough context to build</label></div>'+
    '</div>';
  const rClaim =
    '<div class="rgroup"><span class="rlab">'+(focus.key==="review" ? "Built by" : "Claim")+'</span>'+
      '<div class="rfact">'+claimFact(s)+'</div></div>';
  // Queued only: the pickability rule, spelled out on the card it governs.
  const blockers = [];
  if(!s.ready) blockers.push('<span style="color:var(--ink-3)">needs prep — the ready flag is a human\u2019s call</span>');
  if(!acN) blockers.push('<span style="color:var(--lane-2)">no acceptance criteria yet</span>');
  if(s.claimed_by) blockers.push('<span style="color:var(--accent)">already claimed</span>');
  if(ep && !gateOpen(ep)) blockers.push('<span style="color:var(--lane-2)">⛔ epic gated: '+esc(ep.gate)+'</span>');
  if(unmetDeps.length) blockers.push('<span style="color:var(--lane-2)">⏳ epic waiting on '+esc(unmetDeps.join(" "))+'</span>');
  const rStart =
    '<div class="rgroup"><span class="rlab">Before an agent can pick this up</span><div class="rfact">'+
      (blockers.length ? blockers.join("<br>") : '<span style="color:var(--lane-5)">✓ nothing is in the way</span>')+
    '</div></div>';
  const rEpic = ep
    ? '<div class="rgroup"><span class="rlab">Epic</span><div class="rfact">'+
        '<b>'+esc(ep.id)+'</b> '+esc(ep.name)+'<br>'+
        '<span class="dim">'+epDone+'/'+epStories.length+' stories done</span>'+
        (focus.key==="done" && siblings.length
          ? '<br><span class="dim">the epic ships when '+esc(siblings.join(" "))+' land'+(siblings.length===1?"s":"")+'</span>' : "")+
        (focus.key!=="queued" && !gateOpen(ep) ? '<br><span style="color:var(--lane-2)">⛔ gated: '+esc(ep.gate)+'</span>' : "")+
      '</div></div>'
    : "";
  const rSystems =
    '<div class="rgroup"><label class="rlab" for="s-systems">Systems involved</label>'+
      '<div class="field mono" style="margin-top:0"><input id="s-systems" value="'+esc((s.systems||[]).join(" "))+'" placeholder="space-separated"></div></div>';
  const rUpdated = s.updated_at

  const rail = create ? [rSettings, rEpic, rSystems]
    : focus.key==="queued" ? [rStart, rSettings, rEpic, rSystems, rUpdated]

      (!create && s.claimed_by ? '<button class="btn" id="s-release" title="Clear the claim so this story can be picked up again">↩ Release claim</button>' : '')+
      (create?'':'<button class="btn danger" id="s-del">Delete</button>')+
    '</div>';
  wireAutoGrow(modal);
  // The list is the default reading; the raw lines are one click away.
  const acEditBtn = document.getElementById("s-ac-edit");

function saveModal(){
  const g = id => document.getElementById(id);
  const create = modalMode==="create";
  const claimField = g("f-claim").value.trim();
  const prevClaim = modalMode==="edit" ? (byId()[editingId]||{}).claimed_by : null;
  const vals = {
    id: g("f-id").value.trim(), name: g("f-name").value.trim(), description: g("f-desc").value,
    notes: g("f-notes").value, test_plan: g("f-testplan").value,
    milestone: g("f-ms").value, theme: g("f-theme").value,
    priority: g("f-prio").value, status: g("f-status").value.trim(),
    tags: g("f-tags").value.split(/\s+/).filter(Boolean),
    systems: g("f-systems").value.split(/\s+/).filter(Boolean),
    gate: g("f-gate").value.trim() || "none", column: g("f-lane").value,
    deps: g("f-deps").value.split(/[\s,]+/).filter(Boolean),
    claimed_by: claimField || null,
    claimed_at: claimField ? (claimField===prevClaim ? g("f-claimed-at").value || new Date().toISOString() : new Date().toISOString()) : null,
  };
  const err = g("m-err");
  if(!vals.name){ err.textContent="Name is required."; g("f-name").focus(); return; }
  const oldCol = modalMode==="edit" ? (byId()[editingId]||{}).column : null;
  if(vals.column !== oldCol){
    const chk = checkMove({ id: vals.id, deps: vals.deps }, vals.column);
    if(!chk.ok){ err.textContent = chk.reason; return; }
  }
  if(create){
    if(!vals.id){ err.textContent="ID is required."; g("f-id").focus(); return; }
    if(byId()[vals.id]){ err.textContent='ID "'+vals.id+'" already exists — pick a unique one.'; g("f-id").focus(); return; }
    state.epics.push(Object.assign(vals, { updated_at: new Date().toISOString() }));
  } else {
    const e = byId()[editingId]; if(!e) return closeModal();
    Object.assign(e, vals, { id: e.id, updated_at: new Date().toISOString() });
  }
  closeModal(); render(); persist();
}

// An epic can leave the board once its work is finished — every story in
// the done lane. A story-less epic has no stories to speak for it, so it
// falls back to its own card's lane. One rule, read by the row fold and
// the modal button alike.
function canRemove(e){
  const st = storiesOf(e.id);
  return st.length ? st.every(s => s.column === doneLane()) : e.column === doneLane();
}
// The idea this epic was promoted from, if any — the funnel's other end.
function ideaBehind(epicId){ return (state.ideas||[]).find(i => i.promoted_to === epicId) || null; }
// Say the whole consequence up front: removing can also finish the card's
// lane and close an idea, and neither should be a surprise after the click.
function removeTitle(e){
  const bits = ["Moves "+e.id+" off the active board into Shipped — milestones and dependencies still count it, and your next save records it in History"];
  if(e.column !== doneLane()) bits.push("Also moves the epic card to "+doneLane()+", since every story is done");
  const i = ideaBehind(e.id);
  if(i && ideaStatus(i) !== "done") bits.push("Also closes its idea "+i.id+" out of the funnel");
  return bits.join(". ");
}

// Remove-from-board (or put it back). Archiving hides, never deletes:
// milestones and dependency checks keep reading archived epics from
// state.epics, and the Shipped toggle brings them back into view.
function toggleArchiveEpic(id){
  const e = byId()[id]; if(!e) return;
  if(e.archived_at){
    e.archived_at = null;
    e.updated_at = new Date().toISOString();
    showToast(e.id+" back on the active board.");
    closeModal(); renderFilters(); render(); persist();
    return;
  }
  // Finishing the lane is part of removing it — every story is done, so the
  // card belongs in the done lane whatever it currently says. The dependency
  // guard still rules: this is the same refusal the drag would have given.
  if(e.column !== doneLane()){
    const chk = checkMove(e, doneLane());
    if(!chk.ok){ showToast(chk.reason); return; }
    e.column = doneLane();
  }
  e.archived_at = today();
  e.updated_at = new Date().toISOString();
  // Close the funnel's other end. A promoted idea that never reached `done`
  // sits in Ideas forever looking like open discovery, long after the work
  // it became has shipped — agents promoting via JSON skip the UI's
  // promoteIdea(), so this is the common case, not the rare one.
  const idea = ideaBehind(e.id);
  const closed = idea && ideaStatus(idea) !== "done" ? idea : null;
  if(closed){
    closed.status = "done";
    closed.updated_at = today();
    (closed.log = closed.log || []).push({ at: today(),
      note: "Closed out of the funnel — "+e.id+" finished and left the board." });
  }
  closeModal(); renderFilters(); render();
  persist();
  if(closed) persistResource("ideas", state.ideas);
  showToast(e.id+" removed from the board — find it under Shipped."+
            (closed ? " "+closed.id+" closed out of the funnel too." : ""));
}

function deleteEpic(id){
  const e = byId()[id]; if(!e) return;
  const dependents = state.epics.filter(x => (x.deps||[]).includes(id)).map(x=>x.id);
  const st = storiesOf(id);
  let msg = 'Delete card '+id+' — "'+e.name+'"?';
  if(dependents.length) msg += "\n\nHeads up: "+dependents.join(", ")+" list it as a dependency.";
  if(st.length) msg += "\n\nIts "+st.length+" stor"+(st.length===1?"y":"ies")+" will be deleted too.";
  msg += "\n\nThis writes to epics.json (recoverable via git).";
  if(!window.confirm(msg)) return;
  state.epics = state.epics.filter(x => x.id !== id);
  if(st.length){ state.stories = state.stories.filter(x => x.epic_id !== id); persistResource("stories", state.stories); }
  closeModal(); render(); persist();
}

function closeModal(){ document.getElementById("scrim").classList.remove("on"); editingId=null; applyPendingRefresh(); }
document.getElementById("scrim").addEventListener("click", ev => { if(ev.target.id==="scrim") closeModal(); });
/* ---- board briefing: since you last looked ---- */
// Covers ratified history only (commits since the per-browser last-seen
// HEAD); the pending badge covers unratified working state — no overlap.
function seenKey(){ return "agent-board:seen:" + (((state.config||{}).view||{}).title || "board"); }
function storeSeen(hash){ try{ localStorage.setItem(seenKey(), hash); }catch(e){} }
function staleClaims(){
  return [...(state.epics||[]), ...(state.stories||[])].filter(claimIsStale)
    .map(x => x.id+" — claimed by "+x.claimed_by+" since "+String(x.claimed_at).slice(0,10));
}
async function wireBriefing(){
  let lastSeen = null;
  try{ lastSeen = localStorage.getItem(seenKey()); }catch(e){}
  try{
    if(!lastSeen){
      // first visit: remember where we are, silently
      const h = await (await fetch("/api/history")).json();
      if(h.available && h.commits.length) storeSeen(h.commits[0].hash);
      return;
    }
    const d = await (await fetch("/api/since/"+lastSeen)).json();
    if(!d.available){ if(d.head) storeSeen(d.head); return; }   // rewritten history: reset quietly
    if(!d.statements.length){ storeSeen(d.head); return; }
    const stale = staleClaims();
    const el = document.getElementById("briefing");
    document.getElementById("brf-sum").innerHTML =
      'Since you last looked: <b>'+d.statements.length+' change'+(d.statements.length===1?'':'s')+'</b>'+
      (stale.length ? ' · <b>'+stale.length+' stale claim'+(stale.length===1?'':'s')+'</b>' : '');
    document.getElementById("brf-body").innerHTML =
      d.statements.map(s => '<div class="pp-line">'+esc(s.text)+'</div>').join("")+
      (stale.length ? '<h4>Stale claims (>48h, not done)</h4>'+
        stale.map(t => '<div class="pp-line">'+esc(t)+'</div>').join("") : '');
    el.hidden = false;
    document.getElementById("brf-view").onclick = () => {
      const b = document.getElementById("brf-body"); b.hidden = !b.hidden;
      document.getElementById("brf-view").textContent = b.hidden ? "view" : "hide";
    };
    document.getElementById("brf-dismiss").onclick = () => { storeSeen(d.head); el.hidden = true; };
  }catch(e){}
}

/* ---- command palette (/ to find, n to capture) ---- */
// The index is rebuilt from state per keystroke — always current, no
// cache to invalidate when live refresh swaps the arrays underneath.
function paletteIndex(){
  const ix = [];
  (state.epics||[]).forEach(e => ix.push({ type:"epic", id:e.id, title:e.name||"" }));
  (state.stories||[]).forEach(s => ix.push({ type:"story", id:s.id, title:s.name||"", epic:s.epic_id }));
  (state.ideas||[]).forEach(i => ix.push({ type:"idea", id:i.id, title:i.title||"" }));
  return ix;
}
// Subsequence match; lower = better. Gaps and a late first hit cost,
// shorter targets win ties. null = no match.
function fuzzyScore(q, text){
  q = q.toLowerCase(); text = text.toLowerCase();
  let ti = 0, gaps = 0, first = -1;
  for(const ch of q){
    const at = text.indexOf(ch, ti);
    if(at < 0) return null;
    if(first < 0) first = at;
    gaps += at - ti;
    ti = at + 1;
  }
  return gaps + first * 2 + text.length / 100;
}
let palItems = [], palSel = 0;
function renderPalResults(){
  const q = document.getElementById("pal-input").value.trim();
  const scored = paletteIndex()
    .map(it => ({ it, s: q ? fuzzyScore(q, it.id + " " + it.title) : 0 }))
    .filter(x => x.s !== null);
  if(q) scored.sort((a,b) => a.s - b.s);
  palItems = scored.slice(0, 12).map(x => x.it);
  palSel = Math.max(0, Math.min(palSel, palItems.length - 1));
  document.getElementById("pal-results").innerHTML = palItems.length
    ? palItems.map((it, i) =>
        '<div class="pal-row'+(i===palSel?' sel':'')+'" data-ix="'+i+'">'+
        '<span class="pt">'+it.type+'</span><span class="pid">'+esc(it.id)+'</span>'+
        '<span class="pnm">'+esc(it.title)+'</span></div>').join("")
    : '<div class="pal-none">no matches</div>';
  document.querySelectorAll("#pal-results .pal-row").forEach(row =>
    row.addEventListener("click", () => palGo(palItems[+row.dataset.ix])));
}
function openPalette(){
  palSel = 0;
  document.getElementById("pal-input").value = "";
  document.getElementById("pal-scrim").classList.add("on");
  renderPalResults();
  document.getElementById("pal-input").focus();
}
function closePalette(){ document.getElementById("pal-scrim").classList.remove("on"); }
function palGo(it){
  if(!it) return;
  closePalette();
  if(it.type === "epic") goToEpic(it.id);
  else if(it.type === "story") renderStoryModal(it.epic, it.id);
  else navigate("ideas", it.id);
}
function wirePalette(){
  const input = document.getElementById("pal-input");
  input.addEventListener("input", () => { palSel = 0; renderPalResults(); });
  input.addEventListener("keydown", ev => {
    if(ev.key === "ArrowDown"){ ev.preventDefault(); palSel = Math.min(palSel+1, palItems.length-1); renderPalResults(); }
    else if(ev.key === "ArrowUp"){ ev.preventDefault(); palSel = Math.max(palSel-1, 0); renderPalResults(); }
    else if(ev.key === "Enter"){ ev.preventDefault(); palGo(palItems[palSel]); }
  });
  document.getElementById("pal-scrim").addEventListener("click", ev => {
    if(ev.target === document.getElementById("pal-scrim")) closePalette();
  });
}
const typingTarget = t => t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" ||
  t.tagName === "SELECT" || t.isContentEditable);

document.addEventListener("keydown", ev => {
  const paletteOpen = document.getElementById("pal-scrim").classList.contains("on");
  const modalOpen = document.getElementById("scrim").classList.contains("on");
  if(ev.key === "Escape"){
    const pp = document.getElementById("pending-panel");
    if(paletteOpen) closePalette();
    else if(pp.classList.contains("on")) pp.classList.remove("on");
    else closeModal();
    return;
  }
  if(typingTarget(ev.target) || modalOpen || paletteOpen) return;
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  if(ev.key === "/"){ ev.preventDefault(); openPalette(); }
  else if(ev.key === "n" || ev.key === "N"){ ev.preventDefault(); openIdea(null); }
});

/* ---- pending ratification (ratify review panel) ---- */
// The header badge + slide-over review what a "save" would ratify —
// card-level statements from the server's semantic differ (/api/pending).
// Read-only by design: the panel reviews, the human ratifies.
let pendingData = null;
async function updatePending(){
  try{
    const r = await fetch("/api/pending");
    if(!r.ok) return;
    pendingData = await r.json();
  }catch(err){ return; }
  const b = document.getElementById("pending-badge");
  const n = (pendingData.statements||[]).length;
  const show = pendingData.clean === false && n > 0;
  b.classList.toggle("on", show);
  if(show) b.textContent = n + " pending";
  if(document.getElementById("pending-panel").classList.contains("on")) renderPending();
}
const PENDING_RES_LABEL = { epics:"Epics", stories:"Stories", ideas:"Ideas", config:"Config", milestones:"Milestones" };
function renderPending(){
  const body = document.querySelector("#pending-panel .pp-body");
  const d = pendingData;
  if(!d || d.clean !== false || !(d.statements||[]).length){
    body.innerHTML = '<div class="pp-empty">'+
      (d && d.clean === null ? esc(d.reason) : "Everything ratified — board matches HEAD.")+'</div>';
    return;
  }
  const groups = {};
  d.statements.forEach(s => (groups[s.resource] = groups[s.resource] || []).push(s));
  body.innerHTML =
    Object.keys(PENDING_RES_LABEL).filter(k => groups[k]).map(k =>
      '<div class="pp-group"><h4>'+PENDING_RES_LABEL[k]+' <span class="cnt">'+groups[k].length+'</span></h4>'+
      groups[k].map(s => '<div class="pp-line">'+esc(s.text)+'</div>').join("")+'</div>').join("")+
    '<div class="pp-files">'+ (d.files||[]).map(esc).join(" · ") +'</div>';
}
function wirePending(){
  const badge = document.getElementById("pending-badge");
  const panel = document.getElementById("pending-panel");
  badge.addEventListener("click", async () => {
    await updatePending();          // always fresh on open
    renderPending(); panel.classList.add("on");
  });
  document.getElementById("pp-close").addEventListener("click", () => panel.classList.remove("on"));
  document.addEventListener("click", ev => {
    if(panel.classList.contains("on") && !panel.contains(ev.target) && !badge.contains(ev.target))
      panel.classList.remove("on");
  });
  // A commit made in the terminal doesn't touch data files (no SSE) —
  // refetch when the tab comes back into focus so the badge clears.
  document.addEventListener("visibilitychange", () => { if(!document.hidden) updatePending(); });
  updatePending();
}

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("on"), 4500);
}

/* ---- persistence ---- */
const saveTimers = {};   // per-resource, so an epics save can't cancel a stories save
let savesPending = 0;    // live refresh holds off while our own writes are in flight
function persistResource(resource, val){
  const s = document.getElementById("save"), t = document.getElementById("save-t");
  s.className = "save saving"; t.textContent = "saving…";
  if(saveTimers[resource] == null) savesPending++;
  clearTimeout(saveTimers[resource]);
  saveTimers[resource] = setTimeout(async () => {
    try{
      const r = await fetch("/api/"+resource, {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(val)});
      if(!r.ok) throw new Error("HTTP "+r.status);
      s.className="save"; t.textContent="saved";
    }catch(err){
      s.className="save err"; t.textContent="save failed — is the server running?";
    }finally{
      saveTimers[resource] = null;
      savesPending--;
      applyPendingRefresh();
    }
  }, 150);
}
function persist(){ persistResource("epics", state.epics); }

/* ---- live refresh: the server pushes an SSE event when any data file
   changes on disk (agent edits included); the page refetches instead of
   holding stale state. Deferred while a modal is open, a drag is in
   flight, or our own save hasn't landed yet. ---- */
let pendingRefresh = false, refreshTimer = null;
function refreshBlocked(){
  return savesPending > 0
      || document.getElementById("scrim").classList.contains("on")
      || document.body.classList.contains("is-dragging");
}
/* ---- live-refresh motion: FLIP across the re-render ----
   Rects are captured before applyBoard() replaces the DOM; after the
   re-render, cards that moved are inverted back to their old spot and
   transitioned home wearing the lift look — an agent's edit reads as
   pick-up → glide → set-down instead of a snap. Hidden pages capture
   zero-rects and stay still; own drags never reach this path (the
   own-write echo returns "current" before animating). */
const CARD_SELS = [["e", ".card[data-id]", "id"], ["s", ".scard[data-sid]", "sid"], ["i", ".idea[data-id]", "id"]];
function captureCardPositions(){
  const map = new Map();
  for(const [prefix, sel, key] of CARD_SELS)
    document.querySelectorAll(sel).forEach(el =>
      map.set(prefix+":"+el.dataset[key], { rect: el.getBoundingClientRect(), html: el.innerHTML }));
  return map;
}
function animateCardMoves(before){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  for(const [prefix, sel, key] of CARD_SELS)
    document.querySelectorAll(sel).forEach(el => {
      const old = before.get(prefix+":"+el.dataset[key]);
      if(!old){
        if(before.size){
          el.classList.add("agent-new");
          el.addEventListener("animationend", () => el.classList.remove("agent-new"), { once: true });
        }
        return;
      }
      const now = el.getBoundingClientRect();
      if(!now.width || !old.rect.width) return;   // hidden page — nothing to show
      const dx = old.rect.left - now.left, dy = old.rect.top - now.top;
      if(Math.abs(dx) > 4 || Math.abs(dy) > 4){
        el.style.transition = "none";
        el.style.transform = "translate("+dx+"px,"+dy+"px) scale(1.04) rotate(0.6deg)";
        el.classList.add("agent-lift");
        requestAnimationFrame(() => requestAnimationFrame(() => {
          el.style.transition = "";   // the class's transform transition takes over
          el.style.transform = "";
          const done = ev => {
            if(ev && (ev.target !== el || ev.propertyName !== "transform")) return;
            el.classList.remove("agent-lift");
            el.removeEventListener("transitionend", done);
          };
          el.addEventListener("transitionend", done);
          setTimeout(done, 650);      // safety net if transitionend never fires
        }));
      } else if(old.html !== el.innerHTML){
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 1300);
      }
    });
}

// Returns the outcome ("updated" | "current" | "deferred" | "failed") so a
// manual trigger (the ideas page's ↻ refresh) can report it; SSE callers
// ignore it — a failure there just waits for the next change event.
async function refresh(){
  try{
    const r = await fetch("/api/board");
    if(!r.ok) return "failed";
    const data = await r.json();
    updatePending();   // any disk change moves the pending set too — even own-write echoes
    // Our own writes echo back through the watcher — skip if nothing differs.
    const current = JSON.stringify({ epics: state.epics, stories: state.stories,
      ideas: state.ideas, config: state.config, milestones: state.milestones });
    if(JSON.stringify(data) === current) return "current";
    if(refreshBlocked()){ pendingRefresh = true; return "deferred"; }
    const cardsBefore = captureCardPositions();
    applyBoard(data);
    // A filter can outlive its vocab when config changes under us.
    if(filterMS !== "all" && !MILESTONES.includes(filterMS)) filterMS = "all";
    if(filterTheme !== "all" && !THEMES.includes(filterTheme)) filterTheme = "all";
    renderFilters(); render(); route();
    animateCardMoves(cardsBefore);
    return "updated";
  }catch(err){ return "failed"; }
}
function applyPendingRefresh(){
  if(pendingRefresh && !refreshBlocked()){ pendingRefresh = false; refresh(); }
}
function wireLiveRefresh(){
  const es = new EventSource("/api/events");   // auto-reconnects on server restart
  es.onmessage = () => { clearTimeout(refreshTimer); refreshTimer = setTimeout(refresh, 150); };
  document.addEventListener("dragend", applyPendingRefresh);
}

/* ================= routing (hash-based SPA) ================= */
// Ordered by the flow: ideas (capture) -> milestones (intent) -> board (work),
// plus docs (what the tool can do — CAPABILITIES.md rendered in the UI).
const PAGES = ["ideas","milestones","execution","history","docs"];
const PAGE_LABELS = { execution:"Execution", milestones:"Milestones", ideas:"Ideas", history:"History", docs:"Docs" };
// The execution page was called "board" until the name collided with the
// ideas funnel ("which board?"). Old hashes and every project's existing
// `view.default_page` still resolve — the alias is permanent, not a
// migration window: bookmarks and configs live in other people's repos.
const PAGE_ALIASES = { board:"execution" };
const HOME_PAGE = "execution";
function resolvePage(p){ return PAGE_ALIASES[p] || p; }
function currentRoute(){
  const h = (location.hash || "").replace(/^#\/?/, "");
  const [raw, param] = h.split("/");
  const page = resolvePage(raw);
  return { page: PAGES.includes(page) ? page : HOME_PAGE, param: param ? decodeURIComponent(param) : null };
}
function navigate(page, param){ location.hash = "#/" + page + (param ? "/" + encodeURIComponent(param) : ""); }
function renderTabs(){
  const { page } = currentRoute();
  const t = document.getElementById("tabs");
  t.innerHTML = PAGES.map(p => '<button class="tab" role="tab" data-page="'+p+'" aria-selected="'+(p===page)+'">'+PAGE_LABELS[p]+'</button>').join("");
  t.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => navigate(b.dataset.page)));
}
function updateFooter(page){
  const fn = document.getElementById("footer-note"); if(!fn) return;
  const keys = ' · <b>/</b> find · <b>n</b> capture';
  fn.innerHTML = (page===HOME_PAGE
    ? (boardMode==="rows"
      ? '<b>Rows</b>: one swimlane per epic · <b>drag</b> a story across lanes · <b>click a row header</b> to edit the epic'
      : '<b>drag</b> to move · <b>click</b> to edit · <b>+ add card</b> atop a lane · dependencies gate <b>'+esc(doneLane())+'</b>')
    : page==="milestones"
    ? 'what each milestone delivers · <b>←/→</b> switch milestones · <b>click an epic chip</b> to jump to it in Execution'
    : page==="docs"
    ? 'what this tool can do · source: <b>CAPABILITIES.md</b> · also served at <b>/docs</b> and <b>/llms.txt</b>'
    : page==="history"
    ? 'every save is a commit · <b>click an entry</b> to see its card-level changes · read-only'
    : '<b>click</b> an idea to deep-dive · <b>drag</b> to reorder or change status/burner · <b>+ new idea</b> to capture one') + keys;
}
function route(){
  const { page, param } = currentRoute();
  // An aliased hash is honoured, then quietly rewritten to the canonical
  // one so a copied URL spreads the current name. replaceState, not
  // location.hash: no second hashchange, and no junk in the back button.
  const raw = (location.hash || "").replace(/^#\/?/, "").split("/")[0];
  if(raw && PAGE_ALIASES[raw])
    history.replaceState(null, "", "#/" + page + (param ? "/" + encodeURIComponent(param) : ""));
  PAGES.forEach(p => { const el = document.getElementById("view-"+p); if(el) el.hidden = p!==page; });
  document.querySelectorAll("#tabs .tab").forEach(b => b.setAttribute("aria-selected", b.dataset.page===page));
  const counts = document.getElementById("counts"); if(counts) counts.style.display = page===HOME_PAGE ? "" : "none";
  updateFooter(page);
  if(page==="ideas") renderIdeas(param);
  else if(page==="milestones") renderMilestones(param);
  else if(page==="history") renderHistory();
  else if(page==="docs") renderDocs();
}

/* ================= history view (git log as a page) ================= */
// Every ratification, newest first; expanding an entry lazily fetches its
// card-level statements (cached by hash — commits are immutable).
const historyDiffCache = {};
async function renderHistory(){
  const v = document.getElementById("view-history");
  v.innerHTML = '<div class="vhead"><h2>Ratification history</h2>'+
    '<p>Every save is a commit; every commit is a decision. The data dir’s git log, as a timeline — expand an entry to see its card-level changes.</p></div>'+
    '<div class="htl"><div class="hempty">loading…</div></div>';
  let d;
  try{ d = await (await fetch("/api/history")).json(); }
  catch(err){ d = { available: false, reason: "could not reach the server", commits: [] }; }
  const tl = v.querySelector(".htl");
  if(!d.available){ tl.innerHTML = '<div class="hempty">'+esc(d.reason||"history unavailable")+'</div>'; return; }
  if(!d.commits.length){ tl.innerHTML = '<div class="hempty">No ratifications yet — the first "save" starts the record.</div>'; return; }
  tl.innerHTML = d.commits.map(c =>
    '<div class="hentry" data-hash="'+esc(c.hash)+'">'+
      '<div class="hrowline" title="'+esc(c.hash)+'">'+
        '<span class="hdate">'+esc(c.date)+'</span>'+
        '<span class="hmsg">'+esc(c.message)+'</span>'+
        (c.files.length?'<span class="hfiles">'+c.files.map(esc).join(" · ")+'</span>':"")+
        '<span class="harrow">▸</span>'+
      '</div><div class="hchanges" hidden></div></div>').join("");
  tl.querySelectorAll(".hentry").forEach(entry => {
    entry.querySelector(".hrowline").addEventListener("click", async () => {
      const box = entry.querySelector(".hchanges");
      const open = !box.hidden;
      box.hidden = open;
      entry.querySelector(".harrow").textContent = open ? "▸" : "▾";
      if(open) return;
      const hash = entry.dataset.hash;
      if(!historyDiffCache[hash]){
        box.innerHTML = '<div class="hline">…</div>';
        try{ historyDiffCache[hash] = await (await fetch("/api/history/"+hash)).json(); }
        catch(err){ box.innerHTML = '<div class="hline">could not load this commit’s changes</div>'; delete historyDiffCache[hash]; return; }
      }
      const st = historyDiffCache[hash].statements || [];
      box.innerHTML = st.length
        ? st.map(s => '<div class="hline">'+esc(s.text)+'</div>').join("")
        : '<div class="hline">no card-level changes in this commit</div>';
    });
  });
}

/* ================= docs view (CAPABILITIES.md rendered) ================= */
// A deliberately minimal markdown renderer — covers what CAPABILITIES.md
// uses (h1-h3, paragraphs, "-" lists, bold/italic/code/links, ---), not
// general markdown. Escape-first, then add tags.
function mdToHtml(md){
  const inline = s => s
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<em>$1</em>');
  // "**Term** — …" openers become section-tinted lead terms.
  const lead = s => s.replace(/^<b>([^<]+)<\/b>( —|—)/, '<span class="dterm">$1</span>$2');
  let html = "", para = [], list = [], secN = 0, secOpen = false;
  const flushP = () => { if(para.length){ html += '<p>'+lead(inline(para.join(" ")))+'</p>'; para = []; } };
  const flushL = () => { if(list.length){ html += '<ul>'+list.map(x=>'<li>'+lead(inline(x))+'</li>').join("")+'</ul>'; list = []; } };
  const closeSec = () => { if(secOpen){ html += '</section>'; secOpen = false; } };
  esc(md).split("\n").forEach(ln => {
    if(/^#{1,3} /.test(ln)){ flushP(); flushL(); const lvl = ln.match(/^#+/)[0].length;
      const txt = ln.replace(/^#+ /,"");
      const id = txt.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"");
      // Every h2 opens a section card with the next lane accent.
      if(lvl === 2){ closeSec(); html += '<section class="dsec" style="--sc:var(--lane-'+(secN++ % 6)+')">'; secOpen = true; }
      html += '<h'+lvl+' id="'+id+'">'+inline(txt)+'</h'+lvl+'>'; }
    else if(/^---+\s*$/.test(ln)){ flushP(); flushL(); closeSec(); html += '<hr>'; }
    else if(/^- /.test(ln)){ flushP(); list.push(ln.slice(2)); }
    else if(ln.trim()===""){ flushP(); flushL(); }
    else if(list.length && /^\s/.test(ln)){ list[list.length-1] += " "+ln.trim(); }
    else { flushL(); para.push(ln.trim()); }
  });
  flushP(); flushL(); closeSec();
  return html;
}
// Article + wikipedia-style Contents panel built from the h2 sections.
function docsMarkup(md){
  const body = mdToHtml(md);
  const toc = [];
  body.replace(/<h2 id="([^"]+)">(.*?)<\/h2>/g, (m, id, t) => { toc.push({ id, t: t.replace(/<[^>]+>/g,"") }); return m; });
  return '<div class="docs-grid">'+
    (toc.length ? '<nav class="toc" aria-label="Contents"><div class="toc-t">Contents</div>'+
      toc.map(x => '<a data-target="'+x.id+'">'+x.t+'</a>').join("")+'</nav>' : "")+
    '<div class="mdoc">'+body+'</div></div>';
}
// TOC links scroll the view directly — a real "#section" href would fight
// the hash router. Scrollspy highlights the section under the reading line.
function wireDocsToc(){
  const v = document.getElementById("view-docs");
  const links = [...v.querySelectorAll(".toc a[data-target]")];
  if(!links.length) return;
  const heads = links.map(a => document.getElementById(a.dataset.target)).filter(Boolean);
  const topIn = h => h.getBoundingClientRect().top - v.getBoundingClientRect().top + v.scrollTop;
  links.forEach(a => a.addEventListener("click", ev => {
    ev.preventDefault();
    const h = document.getElementById(a.dataset.target);
    if(h) v.scrollTo({ top: topIn(h) - 12, behavior: "smooth" });
  }));
  const spy = () => {
    let cur = heads[0];
    heads.forEach(h => { if(topIn(h) <= v.scrollTop + 90) cur = h; });
    links.forEach(a => a.classList.toggle("on", !!cur && a.dataset.target === cur.id));
  };
  v.onscroll = spy;
  spy();
}
let docsHtml = null;
async function renderDocs(){
  const v = document.getElementById("view-docs");
  if(docsHtml){ v.innerHTML = docsHtml; wireDocsToc(); return; }
  v.innerHTML = '<div class="mdoc"><p style="color:var(--ink-3)">Loading…</p></div>';
  try{
    const r = await fetch("/docs");
    if(!r.ok) throw new Error("HTTP "+r.status);
    docsHtml = docsMarkup(await r.text());
    v.innerHTML = docsHtml;
    wireDocsToc();
  }catch(e){
    v.innerHTML = '<div class="mdoc"><p style="color:var(--ink-3)">Could not load /docs — this board server predates the docs route. Restart it (Ctrl+C, then ./board &lt;name&gt;) and reload.</p></div>';
  }
}

// ←/→ step through milestones on the Milestones page (ignored while typing
// in a field or while a modal is open).
document.addEventListener("keydown", ev => {
  if(ev.key !== "ArrowLeft" && ev.key !== "ArrowRight") return;
  if(currentRoute().page !== "milestones") return;
  if(document.getElementById("scrim").classList.contains("on")) return;
  const t = ev.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT")) return;
  const list = state.milestones.milestones || [];
  if(!list.length) return;
  const i = Math.max(0, list.findIndex(m => m.id === msSel));
  const j = ev.key === "ArrowLeft" ? Math.max(0, i - 1) : Math.min(list.length - 1, i + 1);
  if(j !== i){ ev.preventDefault(); navigate("milestones", list[j].id); }
});

let msSel = null;
function epicsOfMilestone(m){
  const ids = new Set((m.deliverables||[]).flatMap(d => d.epics||[]));
  return state.epics.filter(e => ids.has(e.id));
}
// Bucket a set of epics by lane *position* — queued / in flight / done —
// so the bar speaks the board's own vocabulary on any lane vocabulary.
// Archived epics still count: archiving hides, it never deletes, and a
// finished milestone whose epics were tidied away must not read empty.
function laneBuckets(epics){
  const done = doneLane(), first = COLUMNS[0];
  const b = { queued:0, flight:0, done:0 };
  epics.forEach(e => {
    if(e.column === done) b.done++;
    else if(e.column === first) b.queued++;
    else b.flight++;
  });
  return b;
}
function progressBar(epics, mini){
  const n = epics.length; if(!n) return "";
  const b = laneBuckets(epics), pc = k => (b[k]/n*100).toFixed(2)+"%";
  const title = b.done+" done · "+b.flight+" in flight · "+b.queued+" not started";
  return '<span class="mbar'+(mini?" mini":"")+'" title="'+esc(title)+'">'+
    (b.done   ? '<i class="d" style="width:'+pc("done")+'"></i>' : '')+
    (b.flight ? '<i class="f" style="width:'+pc("flight")+'"></i>' : '')+
    (b.queued ? '<i class="q" style="width:'+pc("queued")+'"></i>' : '')+'</span>';
}

// The milestone we're "on": earliest (in file order) with mapped epics not all done,
// else the first one at all.
function currentMilestone(){
  const list = state.milestones.milestones || [];
  for(const m of list){
    const eps = epicsOfMilestone(m);
    if(eps.length && eps.some(e => e.column !== doneLane())) return m.id;
  }
  return list.length ? list[0].id : null;
}

}

  }
  html += '<div class="ms-grid"><div>'+left+'</div><div>'+right+'</div></div></div>';
  v.innerHTML = html;
  v.querySelectorAll(".ms-tab").forEach(b => b.addEventListener("click", () => navigate("milestones", b.dataset.id)));
  v.querySelectorAll(".chip-epic[data-id]").forEach(c => c.addEventListener("click", () => goToEpic(c.dataset.id)));
