/* ================= ideas view ================= */
const IDEA_STATUS = ["idea","ready for review","ready to implement"];
const IDEA_STATUS_ARCHIVE = ["done","rejected"];
const IDEA_STATUS_LABEL = { idea:"Idea", "ready for review":"Ready for review", "ready to implement":"Ready to implement", done:"Done", rejected:"Rejected" };
// Legacy statuses from older boards render (and re-save) as their modern form.
const IDEA_STATUS_LEGACY = { considering:"ready for review", planned:"ready to implement", building:"ready to implement" };
const ideaStatus = i => IDEA_STATUS_LEGACY[i.status] || i.status;
let editingIdea = null, ideaMode = "edit", ideasArchive = false;

const EI_LEVELS = ["", "low", "medium", "high"];
const quickWin = i => i.effort==="low" && i.impact==="high";
function eiBadge(i){
  if(quickWin(i)) return '<span class="qwin">★ quick win</span>';
  const bits = [];
  if(i.effort) bits.push(i.effort+" effort");
  if(i.impact) bits.push(i.impact+" impact");
  return bits.length ? '<span class="ei">'+esc(bits.join(" · "))+'</span>' : "";
}
function renderIdeas(param){
  const v = document.getElementById("view-ideas");
  if(param){ renderIdeaDetail(param); return; }
  const ideas = state.ideas || [];
  const archN = ideas.filter(i => IDEA_STATUS_ARCHIVE.includes(ideaStatus(i))).length;
  const cols = ideasArchive ? IDEA_STATUS_ARCHIVE : IDEA_STATUS;
  let html = '<div class="vhead" style="max-width:none;margin:0 0 12px">'+
    '<h2>Ideas backlog</h2><p>Anything worth considering — features, technologies, business moves. Click an idea to deep-dive: context, pros/cons, effort vs impact, what doors it opens.</p></div>'+
    '<div class="ideas-toggle" style="display:flex;gap:7px;align-items:center;margin:0 0 20px">'+
      '<button class="chip" data-arch="0" aria-pressed="'+(!ideasArchive)+'">Active</button>'+
      '<button class="chip" data-arch="1" aria-pressed="'+ideasArchive+'">Done &amp; rejected ('+archN+')</button>'+
      '<button class="chip" id="copy-ideas" style="margin-left:auto" title="Copy this view to the clipboard as markdown — paste it into another tool to brainstorm">⧉ copy</button>'+
      '<button class="chip" id="refresh-ideas" title="Fetch the latest board data now — handy while an agent works the ideas">↻ refresh</button>'+
      '<button class="btn primary" id="new-idea">+ New idea</button>'+
    '</div>';
  const ideaCard = i => {
    const rel = [i.milestone, i.theme].filter(Boolean).map(short).concat(i.tags||[]);
    return '<div class="idea" data-id="'+esc(i.id)+'"'+(ideasArchive?'':' draggable="true"')+'><div class="it">'+esc(i.title)+'</div>'+
      (descParts(i.description).plain ? '<div class="ia">'+esc(descParts(i.description).plain)+'</div>' : '')+
      '<div class="imeta">'+(i.category?'<span class="tagpill">'+esc(i.category)+'</span>':"")+eiBadge(i)+'</div>'+

      (rel.length ? '<div class="irel">'+esc(rel.join(" · "))+'</div>' : '')+
      '</div>';
  };
  // The Idea column splits by priority so attention goes to the top:
  // front burner = the top half of the priority vocab (default Now/Next).
  const prioIx = i => { const x = PRIOS.indexOf(i.priority); return x < 0 ? PRIOS.length : x; };
  const burnerCut = Math.ceil(PRIOS.length/2);
  html += '<div class="ideas-cols" style="grid-template-columns:repeat('+cols.length+',minmax(0,1fr))">'+cols.map(st => {
    const items = ideas.filter(i => ideaStatus(i)===st);
    let body;
    if(!items.length){
      body = '<div style="font-size:12.5px;color:var(--ink-3)">none</div>';
    } else if(st === "idea"){
      // No sort: array order is the queue (AGENTS.md §3) — priority decides
      // the section, drag-reorder decides the order inside it.
      const front = items.filter(i => prioIx(i) < burnerCut);
      const back  = items.filter(i => prioIx(i) >= burnerCut);
      body =
        (front.length ? '<div class="bsec" data-burner="front"><h4 class="burner" title="priority: '+esc(PRIOS.slice(0,burnerCut).join(" / "))+'">Front burner <span class="cnt">'+front.length+'</span></h4>'+front.map(ideaCard).join("")+'</div>' : "")+
        (back.length ? '<div class="bsec back" data-burner="back"><h4 class="burner back" title="priority: '+esc(PRIOS.slice(burnerCut).join(" / "))+'">Back burner <span class="cnt">'+back.length+'</span></h4>'+back.map(ideaCard).join("")+'</div>' : "");
    } else {
      body = items.map(ideaCard).join("");
    }
    return '<div class="ideas-col" data-st="'+esc(st)+'"><h3>'+IDEA_STATUS_LABEL[st]+' <span class="cnt">'+items.length+'</span></h3>'+body+'</div>';
  }).join("")+'</div>';

      showToast("Copied "+n+" idea"+(n===1?"":"s")+" as markdown.");
    }catch(err){ showToast("Couldn't reach the clipboard — is the page focused?"); }
  });
  const rf = document.getElementById("refresh-ideas");
  if(rf) rf.addEventListener("click", async () => {
    const res = await refresh();
    showToast(res==="updated" ? "Refreshed — latest changes loaded."
            : res==="current" ? "Already up to date."
            : res==="deferred" ? "Changes found — applying once the current edit settles."
            : "Could not reach the server.");
  });
  v.querySelectorAll(".ideas-toggle .chip").forEach(b => b.addEventListener("click", () => {
    ideasArchive = b.dataset.arch === "1";
    renderIdeas(null);
  }));
  v.querySelectorAll(".idea").forEach(el => {
    el.addEventListener("click", () => navigate("ideas", el.dataset.id));
    if(!ideasArchive){
      el.addEventListener("dragstart", ev => {
        ev.dataTransfer.setData("text/plain", "idea:"+el.dataset.id);
        ev.dataTransfer.effectAllowed = "move";
        el.classList.add("dragging"); document.body.classList.add("is-dragging");
      });
      el.addEventListener("dragend", () => {
        el.classList.remove("dragging"); document.body.classList.remove("is-dragging");
        v.querySelectorAll(".ideas-col, .bsec").forEach(x => x.classList.remove("drop-hover"));
        clearInsertMarkers();
      });
    }
  });
  if(!ideasArchive){
    v.querySelectorAll(".ideas-col").forEach(col => wireIdeaDrop(col, col.dataset.st, null));
    v.querySelectorAll(".ideas-col[data-st=idea] .bsec").forEach(sec => wireIdeaDrop(sec, "idea", sec.dataset.burner));
  }
}

// The visible ideas view as markdown, for pasting into another tool to
// brainstorm — full descriptions (both halves), a meta line, and the id
// so answers can reference cards back.
function ideasMarkdown(){
  const cols = ideasArchive ? IDEA_STATUS_ARCHIVE : IDEA_STATUS;
  const ideas = state.ideas || [];
  const title = ((state.config||{}).view||{}).title || "board";
  const lines = ["# "+title+" — ideas backlog"+(ideasArchive ? " (done & rejected)" : ""), ""];
  let n = 0;
  const card = i => {
    n++;
    lines.push("### "+i.title+"  `"+i.id+"`", "");
    if(i.description) lines.push(i.description, "");
    const meta = [];
    if(i.category) meta.push("category: "+i.category);
    if(i.priority) meta.push("priority: "+i.priority);
    if(i.effort) meta.push("effort: "+i.effort);
    if(i.impact) meta.push("impact: "+i.impact);
    if(i.milestone) meta.push("milestone: "+i.milestone);
    if(i.theme) meta.push("theme: "+i.theme);
    if((i.tags||[]).length) meta.push("tags: "+i.tags.join(", "));
    if((i.deps||[]).length) meta.push("depends on: "+i.deps.join(", "));
    if(i.rejected_reason) meta.push("rejected because: "+i.rejected_reason);
    if(meta.length) lines.push("— "+meta.join(" · "), "");
  };
  const cut = Math.ceil(PRIOS.length/2);
  for(const st of cols){
    const items = ideas.filter(i => ideaStatus(i)===st);
    if(st === "idea" && items.length){
      // mirror the page: burner sections, array order inside them
      const inFront = x => { const ix = PRIOS.indexOf(x.priority); return ix > -1 && ix < cut; };
      const front = items.filter(inFront), back = items.filter(x => !inFront(x));
      if(front.length){ lines.push("## Idea — front burner ("+front.length+")", ""); front.forEach(card); }
      if(back.length){ lines.push("## Idea — back burner ("+back.length+")", ""); back.forEach(card); }
    } else {
      lines.push("## "+IDEA_STATUS_LABEL[st]+" ("+items.length+")", "");
      items.length ? items.forEach(card) : lines.push("none", "");
    }
  }
  return { md: lines.join("\n"), n };
}

// Drop targets for idea cards: a status column, or a burner section inside
// the Idea column (which also nudges priority into that tier). Every drop
// is positional: an insertion line tracks the gap the card would land in.
function insertionCard(zone, y){
  for(const el of zone.querySelectorAll(".idea:not(.dragging)")){
    const r = el.getBoundingClientRect();
    if(y < r.top + r.height/2) return el;
  }
  return null;   // past the last card → insert at the zone's end
}
function clearInsertMarkers(){
  document.querySelectorAll(".idea.drop-before, .idea.drop-after")
    .forEach(x => x.classList.remove("drop-before", "drop-after"));
}
function wireIdeaDrop(zone, st, burner){
  zone.addEventListener("dragover", ev => {
    ev.preventDefault(); if(burner) ev.stopPropagation();
    ev.dataTransfer.dropEffect = "move"; zone.classList.add("drop-hover");
    if(burner) zone.closest(".ideas-col").classList.remove("drop-hover");
    clearInsertMarkers();
    const before = insertionCard(zone, ev.clientY);
    if(before) before.classList.add("drop-before");
    else {
      const cards = zone.querySelectorAll(".idea:not(.dragging)");
      if(cards.length) cards[cards.length-1].classList.add("drop-after");
    }
  });
  zone.addEventListener("dragleave", ev => {
    if(!zone.contains(ev.relatedTarget)){ zone.classList.remove("drop-hover"); clearInsertMarkers(); }
  });
  zone.addEventListener("drop", ev => {
    ev.preventDefault(); if(burner) ev.stopPropagation();
    zone.classList.remove("drop-hover");
    const before = insertionCard(zone, ev.clientY);
    clearInsertMarkers();
    const data = ev.dataTransfer.getData("text/plain");
    if(!data.startsWith("idea:")) return;
    dropIdea(data.slice(5), st, burner, before ? before.dataset.id : null);
  });
}
function dropIdea(id, st, burner, beforeId){
  const i = ideaById(id); if(!i) return;
  let changed = false;
  if(i.status !== st){ i.status = st; changed = true; }   // also normalizes legacy raw statuses
  const cut = Math.ceil(PRIOS.length/2);
  if(st === "idea" && burner){
    const ix = PRIOS.indexOf(i.priority);
    if(burner === "front" && (ix < 0 || ix >= cut)){ i.priority = PRIOS[cut-1]; changed = true; }
    if(burner === "back" && ix > -1 && ix < cut){ i.priority = PRIOS[cut]; changed = true; }
  }
  // Reorder: the array is the queue (AGENTS.md §3). Insert before the
  // marked card, or after the target zone's last card when dropped past
  // the end (falling back to the array's end for an empty zone).
  const arr = state.ideas, from = arr.indexOf(i);
  arr.splice(from, 1);
  let to = (beforeId && beforeId !== id) ? arr.findIndex(x => x.id === beforeId) : -1;
  if(to < 0){
    const tier = x => { const ix = PRIOS.indexOf(x.priority); return (ix > -1 && ix < cut) ? "front" : "back"; };
    const zone = arr.filter(x => ideaStatus(x) === st && (!burner || tier(x) === burner));
    to = zone.length ? arr.indexOf(zone[zone.length-1]) + 1 : arr.length;
  }
  arr.splice(to, 0, i);
  if(arr.indexOf(i) !== from) changed = true;
  if(!changed) return;
  i.updated_at = new Date().toISOString();
  renderIdeas(null); persistResource("ideas", state.ideas);
}

/* ---- idea deep dive ---- */
function ideaById(id){ return (state.ideas||[]).find(x=>x.id===id); }
// The description convention is a plain-language half, then a "Technical
// shape:" paragraph; the detail page tops its two columns with them.
function descParts(desc){
  if(!desc) return { plain: "", tech: "" };
  const cut = desc.indexOf("\n\nTechnical shape: ");
  if(cut < 0) return { plain: desc, tech: "" };
  return { plain: desc.slice(0, cut), tech: desc.slice(cut + "\n\nTechnical shape: ".length) };
}
function saveIdeas(){ persistResource("ideas", state.ideas); }
// The three-status pipeline as a stepper; done fills everything (+ chip),
// rejected dims the steps (+ chip).
function lifecycleEl(i){
  const st = ideaStatus(i);
  const cur = IDEA_STATUS.indexOf(st);            // -1 for done / rejected
  const doneAll = st === "done", rej = st === "rejected";
  let html = '<div class="steps'+(rej?" rej":"")+'">';
  IDEA_STATUS.forEach((s, ix) => {
    const passed = doneAll || (cur > -1 && ix < cur);
    html += '<span class="step'+(cur===ix?" on":passed?" done":"")+'"><span class="dot"></span>'+esc(IDEA_STATUS_LABEL[s])+'</span>';
    if(ix < IDEA_STATUS.length-1) html += '<span class="bar'+(passed && (doneAll || ix < cur)?" done":"")+'"></span>';
  });
  if(doneAll || rej) html += '<span class="term '+(doneAll?"tdone":"trej")+'">'+esc(IDEA_STATUS_LABEL[st])+'</span>';
  return html+'</div>';
}
// One quiet line: every pill labeled, deps navigable, dates dim right.
function metaRowEl(i){
  let bits = "";
  if(i.priority) bits += '<span class="ml">priority</span><span class="prio '+prioClass(i.priority)+'">'+esc(i.priority)+'</span>';
  if(i.category) bits += '<span class="ml">category</span><span class="tagpill">'+esc(i.category)+'</span>';
  if(i.milestone) bits += '<span class="ml">milestone</span><span class="tagpill" title="'+esc(i.milestone)+'">'+esc(short(i.milestone))+'</span>';
  if(i.theme) bits += '<span class="ml">theme</span><span class="tagpill" title="'+esc(i.theme)+'">'+esc(short(i.theme))+'</span>';
  (i.tags||[]).forEach(t => bits += '<span class="tagpill">'+esc(t)+'</span>');
  if((i.deps||[]).length)
    bits += '<span class="ml">⊸ depends on</span>'+i.deps.map(d =>
      ideaById(d) ? '<button type="button" class="dep-l" data-goidea="'+esc(d)+'">'+esc(d)+'</button>'
                  : '<span class="dep-x" title="not an idea on this board — likely an epic">'+esc(d)+'</span>').join("");
  const dates = [i.created_at ? "created "+String(i.created_at).slice(0,10) : "",
                 i.updated_at ? "updated "+String(i.updated_at).slice(0,10) : ""].filter(Boolean).join(" · ");
  if(dates) bits += '<span class="mdim">'+esc(dates)+'</span>';
  return bits ? '<div class="imeta-row">'+bits+'</div>' : "";
}
function renderIdeaDetail(id){
  const v = document.getElementById("view-ideas");
  const i = ideaById(id);
  if(!i){ v.innerHTML = '<div class="vhead"><h2>Idea not found</h2><p><a href="#/ideas" style="color:var(--accent)">← all ideas</a></p></div>'; return; }
  i.pros = i.pros||[]; i.cons = i.cons||[]; i.sections = i.sections||[]; i.log = i.log||[];
  const dp = descParts(i.description);
  const block = (key, title, body, editable=true) =>
    '<div class="idd-block" data-k="'+key+'"><h3>'+title+(editable?'<button class="eb" data-edit="'+key+'">edit</button>':"")+'</h3><div class="bwrap">'+body+'</div></div>';
  const text = (val, hint) => val ? '<p>'+esc(val)+'</p>' : '<p class="empty">'+hint+'</p>';

  let left = "", right = "";
  left += block("context", "Context — what is this really about?",
    text(i.context, "No context yet. What problem does it solve, for whom, and why now?"));
  left += block("proscons", "Pros / Cons",
    '<div class="procon"><div><h4>Pros</h4>'+(i.pros.length?'<ul>'+i.pros.map(p=>'<li class="pro">'+esc(p)+'</li>').join("")+'</ul>':'<p class="empty">none listed</p>')+'</div>'+
    '<div><h4>Cons</h4>'+(i.cons.length?'<ul>'+i.cons.map(c=>'<li class="con">'+esc(c)+'</li>').join("")+'</ul>':'<p class="empty">none listed</p>')+'</div></div>');
  if(i.status==="rejected" || i.rejected_reason)
    left += block("reject", "Rejected — why", text(i.rejected_reason, "no reason recorded"), true);

  // The decision lens: least work, greatest impact, compounding doors.
  const seg = (k, val) => '<div class="seg" role="group" aria-label="'+k+'" data-k="'+k+'">'+
    EI_LEVELS.map(l => '<button type="button" data-v="'+l+'" aria-pressed="'+(l===(val||""))+'">'+(l||"—")+'</button>').join("")+'</div>';
  const verdict = quickWin(i)
    ? '<div class="verdict qwin">★ quick win — least work, greatest impact</div>'
    : (i.effort && i.impact)
      ? '<div class="verdict quiet">'+esc(i.effort)+' effort · '+esc(i.impact)+' impact</div>'
      : '<div class="verdict hint">rate effort and impact to see the verdict</div>';
  right += '<div class="idd-block lens"><h3>Decision lens</h3>'+
    '<div class="lrow">'+
      '<div class="lsel"><label>Effort (how much work?)</label>'+seg("effort", i.effort)+'</div>'+
      '<div class="lsel"><label>Impact (how much value?)</label>'+seg("impact", i.impact)+'</div>'+
    '</div>'+verdict+
    '<h3 style="margin-top:4px">Compounding — what doors does this open?<button class="eb" data-edit="compounding">edit</button></h3>'+
    '<div class="bwrap">'+text(i.compounding, "Does building this make several later things cheaper? Infrastructure that compounds beats features that don\'t.")+'</div></div>';
  right += block("sections", "Deep-dive sections",
    (i.sections.length ? i.sections.map((s,ix) =>
      '<div class="sec-item"><h4>'+esc(s.title)+'<button class="eb" data-editsec="'+ix+'">edit</button></h4><p>'+esc(s.body)+'</p></div>').join("") :
      '<p class="empty">Anything else the decision needs: UI sketches, market analysis, technical spikes, competitor notes…</p>')+
    '<button type="button" class="addstory" id="sec-add">+ add section</button>', false);
  right += '<div class="idd-block loose"><h3>Brainstorm log</h3>'+
    (i.log.length ? '<ul class="idd-log">'+i.log.map(l=>'<li><span class="lat">'+esc(l.at)+'</span><span class="lnote">'+esc(l.note)+'</span></li>').join("")+'</ul>' : '<p class="empty">No notes yet — the running journal of how thinking on this idea evolves.</p>')+
    '<div class="logadd"><input type="text" id="log-in" placeholder="Add a thought…"><button class="btn" id="log-add">Add</button></div></div>';

  v.innerHTML = '<div class="idd">'+
    '<button class="back" id="idd-back">← all ideas</button>'+
    '<div class="ihead"><h2>'+esc(i.title)+'</h2>'+
      (quickWin(i)?'<span class="qwin">★ quick win</span>':"")+
      '<span style="margin-left:auto;display:flex;gap:8px">'+
        '<button class="btn" id="idd-edit">Edit core</button>'+
      '</span></div>'+
    lifecycleEl(i)+
    metaRowEl(i)+
    '<div class="idd-grid"><div>'+
      (dp.plain ? '<p class="dplain">'+esc(dp.plain)+'</p>' : "")+left+'</div><div>'+
      (dp.tech ? '<div class="dtech"><h4>Technical shape</h4><p>'+esc(dp.tech)+'</p></div>' : "")+right+'</div></div></div>';

  document.getElementById("idd-back").addEventListener("click", () => navigate("ideas"));
  document.getElementById("idd-edit").addEventListener("click", () => openIdea(i.id));
  v.querySelectorAll(".lens .seg button").forEach(b => b.addEventListener("click", () => {
    const k = b.closest(".seg").dataset.k;
    if(i[k] === b.dataset.v) return;
    i[k] = b.dataset.v; i.updated_at = today(); saveIdeas(); renderIdeaDetail(id);
  }));
  v.querySelectorAll("[data-goidea]").forEach(b => b.addEventListener("click", () => navigate("ideas", b.dataset.goidea)));
  document.getElementById("log-add").addEventListener("click", addLog);
  document.getElementById("log-in").addEventListener("keydown", ev => { if(ev.key==="Enter") addLog(); });
  function addLog(){
    const inp = document.getElementById("log-in");
    const note = inp.value.trim(); if(!note) return;
    i.log.push({ at: today(), note }); i.updated_at = today();
    saveIdeas(); renderIdeaDetail(id);
  }
  document.getElementById("sec-add").addEventListener("click", () => editSection(-1));
  v.querySelectorAll("[data-editsec]").forEach(b => b.addEventListener("click", () => editSection(+b.dataset.editsec)));
  v.querySelectorAll("[data-edit]").forEach(b => b.addEventListener("click", () => inlineEdit(b.dataset.edit)));

  // swap a block's content for an editor
  function inlineEdit(key){
    const blockEl = v.querySelector('.idd-block[data-k="'+key+'"] .bwrap') || v.querySelector('.lens .bwrap');
    const isLens = key==="compounding";
    const target = isLens ? v.querySelector('.lens .bwrap') : blockEl;
    if(!target) return;
    let val = key==="context" ? (i.context||"") : key==="compounding" ? (i.compounding||"") : key==="reject" ? (i.rejected_reason||"") : "";
    if(key==="proscons"){
      target.innerHTML =
        '<div class="procon"><div><h4>Pros (one per line)</h4><textarea id="e-pros">'+esc(i.pros.join("\n"))+'</textarea></div>'+
        '<div><h4>Cons (one per line)</h4><textarea id="e-cons">'+esc(i.cons.join("\n"))+'</textarea></div></div>'+
        '<div class="actions"><button class="btn primary" id="e-save">Save</button><button class="btn" id="e-cancel">Cancel</button></div>';
      target.querySelector("#e-save").addEventListener("click", () => {
        i.pros = target.querySelector("#e-pros").value.split("\n").map(x=>x.trim()).filter(Boolean);
        i.cons = target.querySelector("#e-cons").value.split("\n").map(x=>x.trim()).filter(Boolean);
        i.updated_at = today(); saveIdeas(); renderIdeaDetail(id);
      });
    } else {
      target.innerHTML = '<textarea id="e-val">'+esc(val)+'</textarea>'+
        '<div class="actions"><button class="btn primary" id="e-save">Save</button><button class="btn" id="e-cancel">Cancel</button></div>';
      target.querySelector("#e-save").addEventListener("click", () => {
        const nv = target.querySelector("#e-val").value;
        if(key==="context") i.context = nv;
        else if(key==="compounding") i.compounding = nv;
        else if(key==="reject") i.rejected_reason = nv.trim()||null;
        i.updated_at = today(); saveIdeas(); renderIdeaDetail(id);
      });
    }
    target.querySelector("#e-cancel").addEventListener("click", () => renderIdeaDetail(id));
    const f = target.querySelector("textarea"); if(f) f.focus();
  }
  function editSection(ix){
    const create = ix < 0;
    const s = create ? { title:"", body:"" } : i.sections[ix];
    const wrap = v.querySelector('.idd-block[data-k="sections"] .bwrap');
    wrap.innerHTML = '<input type="text" id="e-st" placeholder="Section title (e.g. UI sketch, Market analysis)" value="'+esc(s.title)+'" style="margin-bottom:8px">'+
      '<textarea id="e-sb" style="min-height:120px" placeholder="The material…">'+esc(s.body)+'</textarea>'+
      '<div class="actions"><button class="btn primary" id="e-save">'+(create?"Add":"Save")+'</button><button class="btn" id="e-cancel">Cancel</button>'+
      (create?"":'<button class="btn danger" id="e-del">Delete section</button>')+'</div>';
    wrap.querySelector("#e-save").addEventListener("click", () => {
      const title = wrap.querySelector("#e-st").value.trim();
      const body = wrap.querySelector("#e-sb").value;
      if(!title) return;
      if(create) i.sections.push({title, body}); else Object.assign(s, {title, body});
      i.updated_at = today(); saveIdeas(); renderIdeaDetail(id);
    });
    wrap.querySelector("#e-cancel").addEventListener("click", () => renderIdeaDetail(id));
    const del = wrap.querySelector("#e-del");
    if(del) del.addEventListener("click", () => { i.sections.splice(ix,1); i.updated_at = today(); saveIdeas(); renderIdeaDetail(id); });
    wrap.querySelector("#e-st").focus();
  }
}

function blankIdea(){ return { id:"idea-"+Date.now(), title:"", description:"", notes:"", category:"", theme:"", milestone:"", tags:[], deps:[],
  status:"idea", priority:PRIOS[0], effort:"", impact:"", context:"", compounding:"", pros:[], cons:[], sections:[], log:[],
  rejected_reason:null, created_at:today(), updated_at:null }; }
function openIdea(id){
  ideaMode = id ? "edit" : "create";
  const i = id ? (state.ideas||[]).find(x=>x.id===id) : blankIdea();
  if(!i) return;
  editingIdea = i.id;
  const modal = document.getElementById("modal");
  modal.innerHTML = '<h2 id="m-title"><span>'+(id?"Edit idea":"New idea")+'</span></h2>'+
    '<div class="field"><label for="i-title">Title</label><input id="i-title" value="'+esc(i.title)+'"></div>'+
    '<div class="field"><label for="i-desc">Description</label><textarea id="i-desc" style="min-height:70px">'+esc(i.description||"")+'</textarea></div>'+
    '<div class="field row2">'+
      '<div><label for="i-status">Status</label><select id="i-status">'+IDEA_STATUS.concat(IDEA_STATUS_ARCHIVE).map(s=>'<option value="'+s+'"'+(s===ideaStatus(i)?' selected':'')+'>'+IDEA_STATUS_LABEL[s]+'</option>').join("")+'</select></div>'+
      '<div><label for="i-prio">Priority</label><select id="i-prio">'+opts(PRIOS,i.priority)+'</select></div>'+
    '</div>'+
    '<div class="field"><label for="i-cat">Category (free text — feature, technology, business, process…)</label><input id="i-cat" value="'+esc(i.category||"")+'"></div>'+
    '<div class="field row2">'+
      '<div><label for="i-ms">Milestone</label><select id="i-ms"><option value="">—</option>'+opts(MILESTONES,i.milestone||"")+'</select></div>'+
      '<div><label for="i-theme">Theme</label><select id="i-theme"><option value="">—</option>'+opts(THEMES,i.theme||"")+'</select></div>'+
    '</div>'+
    '<div class="field mono"><label for="i-tags">Tags (space-separated)</label><input id="i-tags" value="'+esc((i.tags||[]).join(" "))+'"></div>'+
    '<div class="field mono"><label for="i-deps">Depends on (space-separated idea/epic ids — optional)</label><input id="i-deps" value="'+esc((i.deps||[]).join(" "))+'"></div>'+
    '<div class="field"><label for="i-reject">Rejected reason (if rejecting)</label><textarea id="i-reject" style="min-height:50px">'+esc(i.rejected_reason||"")+'</textarea></div>'+
    '<div class="m-err" id="m-err"></div>'+
    '<div class="actions"><button class="btn primary" id="i-save">'+(id?"Save":"Create")+'</button><button class="btn" id="i-cancel">Cancel</button>'+(id?'<button class="btn danger" id="i-del">Delete</button>':'')+'</div>';
  document.getElementById("scrim").classList.add("on");
  document.getElementById("i-save").addEventListener("click", saveIdea);
  document.getElementById("i-cancel").addEventListener("click", closeModal);
  if(id) document.getElementById("i-del").addEventListener("click", () => deleteIdea(i.id));
  document.getElementById("i-title").focus();
}
function saveIdea(){
  const g = id => document.getElementById(id);
  const title = g("i-title").value.trim();
  if(!title){ g("m-err").textContent = "Title is required."; g("i-title").focus(); return; }
  const vals = { title, description:g("i-desc").value, status:g("i-status").value, priority:g("i-prio").value,
    category:g("i-cat").value.trim(), milestone:g("i-ms").value, theme:g("i-theme").value,
    tags:g("i-tags").value.split(/\s+/).filter(Boolean), deps:g("i-deps").value.split(/[\s,]+/).filter(Boolean),
    rejected_reason:g("i-reject").value.trim()||null, updated_at:today() };
  let landedId = editingIdea;
  if(ideaMode==="create"){ const ni = Object.assign(blankIdea(), vals); state.ideas.push(ni); landedId = ni.id; }
  else { const i = (state.ideas||[]).find(x=>x.id===editingIdea); if(i) Object.assign(i, vals); }
  closeModal(); persistResource("ideas", state.ideas);
  // a new idea goes straight to its deep-dive page; an edit re-renders wherever we are
  if(ideaMode==="create") navigate("ideas", landedId);
  else { const {page, param} = currentRoute(); if(page==="ideas") renderIdeas(param); }
}
function deleteIdea(id){
  if(!window.confirm("Delete this idea? Consider setting status to Rejected instead, so the reason survives. (recoverable via git either way)")) return;
  state.ideas = (state.ideas||[]).filter(x=>x.id!==id);
  closeModal(); persistResource("ideas", state.ideas);
  navigate("ideas"); renderIdeas(null);
}

load().catch(() => {
  document.getElementById("board").innerHTML =
    '<div style="padding:40px;color:var(--ink-3)">Could not load the board. Start the server with <b style="color:var(--ink)">node server.js</b> and reload.</div>';
});
